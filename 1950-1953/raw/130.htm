<td class="t50">1952年1月12日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　江泽涵十一月卅日的信，由香港用平信寄来，今日才到。<br /><br />
　　“我们开始觉得你们如果在北京，必定不会感觉不舒服的。我这么觉得，也还是近半年多以来的事，而且也是我们自己心里相信的。”<br /><br />
　　“你可以想象我们的生活是很快乐的。……”<br /><br />
