<td class="t50">1951年12月12日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　晚车起程，明天下午到南本德的圣母马利亚大学。此去是参加圣母马利亚大学的自然法学会。我的讲题是《中国思想中的自然法概念》。<br /><br />
　　我为此题，已费了二十日的工夫，写成大半。明天火车上还可以打字，大概可以完了。<br /><br />
