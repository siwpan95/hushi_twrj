<td class="t50">1952年3月20日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　罗伯特·莫里斯先生：<br /><br />
　　华盛顿参议院办公大楼424室<br /><br />
　　兹答复您提出的询问。据我目前所能回忆，事情发生在一九四一年六月廿九日的一两天前，中国驻美大使馆参赞Liu 
Chieh在一次社交宴会早餐时告诉我，前一天晚上，拉夫林·居里先生无意中告诉他，罗斯福总统推荐欧文·拉底莫尔先生出任蒋介石的政治顾问，任命马上公布。现任驻加拿大大使的Liu 
Chieh先生证实了这一回忆。可惜的是，我和他当时均未记录谈话的日期。<br /><br />
　　胡适<br /><br />
