<td class="t50">1952年8月24日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　看完保罗·海德·邦纳的小说SPQR。<br /><br />
　　SPQR是“ Senatus Populas que Romanus”的缩写。凡罗马所有的，都盖此印为记。<br /><br />
　　此书作者曾在美国驻罗马大使馆任职，后来在大战后又在罗马做大使的特别顾问。他很熟悉罗马情形，故此书很动人。<br /><br />
　　多年没有工夫看长篇小说了。此次休息，读小说两本，可说是很快乐的事。<br /><br />
