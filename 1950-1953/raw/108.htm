<td class="t50">1951年9月7日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　我在一九二六年曾读日本忽滑谷快天的《中国禅学史》上下两册。此书现已不可得，姑记之。<br /><br />
　　此间有研究生理查·德马丁（纽约，西赫普斯蒂德，费尔劳大街190号）曾从铃木大拙学禅宗，要用神会为他的博士论文题，今天他来谈甚久。<br /><br />
　　昨夜续编先父的《台湾日记与禀启》，成第二卷。<br /><br />
