<td class="t50">1950年10月3日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　写长信给赵元任及韵卿夫人，恳求他们不可把原本《四部丛刊》（2100册）寄给我。我已有一部缩本了，已占一大架。现时无法安插二千一百册线装书，故哀求他们不要寄赠我。<br /><br />
　　前几天他们寄赠哈佛丛书全部五十册，此是“老相知”，我的《藏晖室札记》开卷第一天（Jan·30，1911）即记我收到“哈佛丛书”五十册，那一天是辛亥年元旦，我作律诗一首，有“往事潮心上，奇书照眼明”之句，即指此事。<br /><br />
</td></tr>
