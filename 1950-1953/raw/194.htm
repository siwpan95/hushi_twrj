<tr><td>
<br />
　　今日台湾的军人中，有这些新人是受过西方高等训练的：<br /><br />
　　孙立人 陆军总司令<br /><br />
　　贾幼慧 副司令<br /><br />
　　王国华<br /><br />
　　王 之<br /><br />
　　曾锡珪<br /><br />
　　以上都是清华出身。<br /><br />
　　侯腾（黄埔二期）。与他同在列维沃思受训练的有二三十人。<br /><br />
　　马纪壮（黄埔，曾到美国），现为海军总司令。<br /><br />
　　王叔铭<br /><br />
