<td class="t50">1951年8月27日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今天收到G·M·葛思德先生的女儿西罗亚·葛思德·米格达斯基（雷诺·F·米格达斯基夫人）从阿肯色州托普山波罗尼亚大农场来信。大概是多尔特博士告诉他的。<br /><br />
　　多尔特说：葛思德先生有一子一女，女即阿肯色州欧扎克的米格达斯基夫人，儿子约瑟夫·H·葛思德在加拿大魁北克蒙特利尔市默里街386号。<br /><br />
