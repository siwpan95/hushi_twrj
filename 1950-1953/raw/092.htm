<td class="t50">1951年4月19日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　到费城赴美国哲学学会的春季大会。<br /><br />
　　此会是本杰明·富兰克林在一七四三年发起的，是美洲最老的学会。<br /><br />
　　我是一九三六年被选的外国会员。<br /><br />
　　下午到会听A·W·休姆读论文，题为《中国文化的基本原则》。<br /><br />
　　遇见许多熟人。<br /><br />
