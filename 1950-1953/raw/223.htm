<td class="t50">1953年6月28日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　晚十时，得吴国桢先生电话，知道他今天到了，住在大使旅馆，他们夫妇要来看我。我说，我的地方太小，太热，还是我来看你们。<br /><br />
　　我去同他们谈了三个钟头。<br /><br />
　　他们谈的话，使我十分诧怪。吴太太说：“我们都是基督徒，深信上帝保佑我们，胡先生是无神论者，他也许不相信。”<br /><br />
　　我所谓“使我十分诧怪”，当然是指他们的话的一部分。<br /><br />
