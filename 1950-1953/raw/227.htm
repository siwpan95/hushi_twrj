<td class="t50">1953年9月9日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　一九一〇年我们七十一个中国留学生在旧金山登岸，正是加利福尼亚加入“联邦”（美国）的五十年纪念，有连日的庆祝会。<br /><br />
　　今天偶见此日，回头已是四十三年了！<br /><br />
　　此举甚可注意。我很盼大都会博物馆和公共图书馆能利用此款，多收各国的象棋与象棋史料。当做一书与两机关主持者。<br /><br />
