<td class="t50">1952年6月1日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今夜八点半，得约翰·杜威夫人的电话，说杜威先生今夜七点死了。<br /><br />
　　他生在一八五九年十月廿日，去年十月满九十二岁。<br /><br />
　　杜威先生的思想，影响了我一生。他的《哲学的重建》是一九一九年在日本的讲演，一九二〇年印出的。一九四八年，此书由比克出版社重印，有杜威先生的长序，题为《二十五年后再看重建》，其年月为一九四八年十月，实已在廿九年后了。在此新序里，他对于这廿五年的哲学思想表示不满足，认为还是需要“改造”。老先生的精神（他那时正八十九岁）真可佩服！<br /><br />
</td></tr>
