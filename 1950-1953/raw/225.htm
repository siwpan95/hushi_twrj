<td class="t50">1953年8月28日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　《庄子》内篇《逍遥游》：<br /><br />
　　……故夫知效一官，行比（李云，合也）一乡，德合一君而征（司马云，信也。崔支云，成也）一国者，其自视也，亦若是而已矣。<br /><br />
　　而宋荣子犹然笑之。<br /><br />
　　且举世而誉之而不加劝，举世而非之而不加沮。定乎内外之分，辩乎荣辱之竟，斯已矣。<br /><br />
　　“举世誉之而不加劝，举世非之而不加沮”两句，似始见于此。<br /><br />
　　我记得此二句，似常见于他书，当寻求之。<br /><br />
