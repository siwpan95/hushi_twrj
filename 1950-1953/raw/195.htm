<td class="t50">1952年11月16日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今日搭西北航空公司的飞机从埃德怀特机场起飞，送的人很多。<br /><br />
　　晚上到西雅图，有中华俱乐部的普赖斯夫人及华侨领袖多人来接。<br /><br />
　　来者有查尔斯·E·马丁博士和夫人、胡敦复先生夫人、李方桂先生夫人、朱文长等。在机场内的一个休息室里，我们谈了两点多钟。<br /><br />
</td></tr>
