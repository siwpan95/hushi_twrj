<td class="t50">1951年3月22日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　读莫勒的书稿，其中记莱特岛的大战（Oct.22—25，1944），日本损失58只船，事后点死尸，日本兵死的74261，美国兵死的3135。<br /><br />
　　此一战为菲律宾海的大海战。太平洋战局，此一战已定胜败。但我回想，我那时正在哈佛教书的第一个月，故对于此绝大的胜利，好像没有多大印象！<br /><br />
