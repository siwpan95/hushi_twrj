<td class="t50">1950年7月11日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　北京大学农学院罗道庄农牧场牛奶款收据<br /><br />
　　今收到胡校长先生自10月1至31日止，牛奶壹磅31瓶，合￥440整元。<br /><br />
　　经手人35年10月31日<br /><br />
　　今天我们偶然发现这张牛奶款收据，冬秀想不起这张破纸如何飞来海外，大概是包小物来的。<br /><br />
　　适之 卅九年〔1950〕七月十一日<br /><br />
