<td class="t50">1951年6月13日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　莎士比亚的十四行诗真有百读不厌的好诗。友人摘出这些：<br /><br />
　　毁灭便教我再三反省：时光终究要跑来把我的爱带走。哦，多么致命的思想！它只能哭着去把那刻刻怕失去的占有。<br /><br />
　　看见了这些，你的爱就会加强，因为他转瞬要辞你溘然长往。<br /><br />
　　但是只要那刻我想起你，挚友，损失全收回，悲哀也化为乌有。<br /><br />
　　对于我，俊友，你永远不会衰老，因为自从我的眼碰见你的眼，你还是一样美。<br /><br />
　　爱这呆子是那么无可救药的呆，凭你为所欲为，他都不觉得坏。<br /><br />
</td></tr>
