<td class="t50">1950年1月9日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　昨天蒋夫人宋美龄作临别广播，说得很愤慨沉痛。这是她最好的演说。我写一短信贺她。<br /><br />
　　写长信给王雪艇，给孟真〔傅斯年〕，给雷儆寰，皆托游建文带回去。<br /><br />
　　与诺曼·安吉尔先生同吃饭，在座的有德怀特·莫罗夫人，谈得很痛快。<br /><br />
　　安吉尔是今世一个最能思想的政论家，四十五年如一日，为西方民主国家作先见的警告，老而不倦。<br /><br />
　　我一生受他的影响很大。我从“不抵抗”主义逐渐转到用力量制裁强暴的见解，是受了他和约翰·杜威的影响。<br /><br />
</td></tr>
