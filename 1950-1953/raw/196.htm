<td class="t50">1952年11月18日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　下午到东京，飞机晚了两点钟。董大使显光与朋友多人来接。<br /><br />
　　大使为我请了许多日本客人与美国客人。有野村、那须浩、盐谷温诸人。<br /><br />
　　半夜后离开东京。<br /><br />
