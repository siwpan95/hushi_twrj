<td class="t50">1951年2月27日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　到费城给外交事务委员会演说一点钟，答问一点钟。<br /><br />
　　住在威廉·F·麦切德先生家中，他的夫人是罗兰·莫里斯的女儿，是费城的一个最老的世家小姐。她说，费城一城大概有四千人可算是她的兄弟姊妹！<br /><br />
　　她的直系祖宗是史蒂芬·德凯特，家中挂有德凯特夫妇的画像。<br /><br />
　　德凯特曾有名言：<br /><br />
　　我的祖国，正义的祖国！孰是孰非，终究是我的祖国！<br /><br />
