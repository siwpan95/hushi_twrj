<td class="t50">1953年1月18日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　与张伯谨、王信忠去走书店，仅走了“汤岛圣堂”（孔庙）的一处，买了一些书。<br /><br />
　　董大使中午约吃中国饭。<br /><br />
　　晚上大使为我约了一大桌客，有日本人。其中有最高法院长田中耕太郎、前田、松方、盐谷温诸人。<br /><br />
