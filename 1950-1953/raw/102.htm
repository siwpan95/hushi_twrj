</td></tr>
<tr><td>
<br />
　　上引赫胥黎的话甚有理。<br /><br />
　　我们的历史上也有同样的事实。儒家经传的“立于学官”，其作用是建立一批有最高威权的根本大法。赫胥黎说的宪法与大宪章意即指此。<br /><br />
　　往年A·W·休姆曾作此说，我曾表示赞同，并引申其意。试看《春秋》（公羊）与《洪范》在汉朝的权威，岂不是两部“根本大法”？<br /><br />
