<td class="t50">1953年5月3日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　我同此君在迪金森学院同受博士学位（1941？），他的夫人开车，我们同回到纽约。以后我们偶通信，他们常送新种的荔枝给我。此君由会计师转成为税法专家，又曾为国家效力，晚年成为植物学者，可谓兴趣广博！<br /><br />
