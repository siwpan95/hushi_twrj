<td class="t50">1952年9月29日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　到国会图书馆，读书。我前天已先托吴光清先生把馆中我要检的《水经注》都找出，让我检勘一天，共计查了：<br /><br />
　　1.吴琯刻《水经注》<br /><br />
　　2.朱谋《水经注笺》<br /><br />
　　3.朱谋 《水经注笺》（赵一清朱墨校本。原藏北平图书馆，此系缩微胶卷。）<br /><br />
　　4.项刻《朱笺》竟陵本。（原刻）<br /><br />
　　5.黄晟翻刻项本。（原刻初印，甚罕见）<br /><br />
　　6.王先谦《合校〈水经注〉》<br /><br />
　　7.嘉庆八年（1803）朱文翰纂《山阴县志》。<br /><br />
　　从九点半到下午四点，工作很有趣。<br /><br />
