<td class="t50">1951年9月23日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　写信复《华盛顿邮报》编辑人赫伯特·埃利斯通。<br /><br />
　　今夜编先父的《台湾日记与禀启》，成第三卷。<br /><br />
　　全书三卷。<br /><br />
　　卷一，巡阅全台防营；<br /><br />
　　卷二，提调台南盐务；<br /><br />
　　卷三，知台东直隶州，兼代统后山防营。<br /><br />
　　全书约有十万字。<br /><br />
