<td class="t50">1952年2月20日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　“中国书展览”，今天各架都摆好了。<br /><br />
　　我不很满意，因为有些书竟无地可放，又有些书，我认为不能不收入，而版本不好，不能不暂缺。前者如元刻的书，一本都没有列入。（如碛砂版《大藏》，已陈列绍定五年（1232）刻的一册了，故不列元时续刻诸经了。）后者如《本草纲目》、如《农政全书》，都没有原刻本，所以不列入。<br /><br />
</td></tr>
