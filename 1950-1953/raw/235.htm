<td class="t50">1953年12月30日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　纪五给我看一封信，是一个朋友写的，其中说：<br /><br />
　　对他（纪五）来说，向普林斯顿大学图书馆馆长请教一下是个好主意，然而，他一定被人提醒不要发表任何评论。这很重要的，正如您所知……<br /><br />
　　这两句话使我很感兴趣。<br /><br />
