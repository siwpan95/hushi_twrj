<tr><td class="t50">卷三 九、读《嘉富尔传》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月十一日）<br /><br />
　　今日读Andrew D. 
White之嘉富尔（Cavour）传，甚喜之。意大利建国三杰玛里尼、加里波的与嘉富尔，各有所长，各行其是。玛主共和，以笔舌开其先；嘉主统一宪政国，以外交内政实行之；加亦主民主，以一剑一帜实行之。三子者不同道，其为人杰则一也。一者何也？新意大利也。<br /><br />
</td></tr>
