<tr><td class="t50">卷三 二二、叔永岁末杂感诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿三日）<br /><br />
　　任叔永作岁末杂感诗数章见示，第一首总叙，第二首《雪》，第三首《滑冰》，第四首《度岁》。其《雪》诗起云，“昨夜天忽雪，侵晓势益盛”；中有“轻盈尚扑面，深厚已没胫。远山淡微林，近潭黝深凝。疏枝压可折，高檐滑欲迸”。其《滑冰》诗有“毡裘带双鞲，铁屐挺孤棱；蹑足一纵送，飘忽逐飞甑”。其《度岁》诗“冬青罗窗前，稚子戏阶砌。有时笑语声，款款出深第。感此异井物，坐怀故乡例。夙驾信未遑，幽居聊小憩”。皆佳。<br /><br />
</td></tr>
