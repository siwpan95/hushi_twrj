<tr><td class="t50">一九一二年十二月十三日（星五）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　昨日作文论阿里士多得“中庸”说。尝谓宋儒“不易之谓庸”之说非也。中者，无过无不及之谓。《中庸》屡言贤者过之，愚不肖不及；又论勇有南北之别，皆过与不及之异也。又言舜执其两端，用其中于民，此则与阿氏中说吻合矣。庸者，寻常之谓，如庸言庸行之庸，书中屡及之。又言素隐行怪之非，以其非庸言庸行也。<br /><br />
　　是夜往Patterson家，坐甚久。<br /><br />
