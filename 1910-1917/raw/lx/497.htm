<tr><td class="t50">卷五 二八、“是”与“非”</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月廿六日）<br /><br />
　　孔子曰：“父为子隐，子为父隐，直在其中矣。”仁人之言也。故孔子去鲁，迟迟其行，曰：“去父母之国之道也。”其作《春秋》，多为鲁讳，则失之私矣。然其心可谅也。吾亦未尝无私，吾所谓“执笔报国”之说，何尝不时时为宗国讳也。是非之心，人皆有之，然是非之心能胜爱国之心否，则另是一问题。吾国与外国开衅以来，大小若干战矣，吾每读史至鸦片之役，英法之役之类，恒谓中国直也；至庚子之役，则吾终不谓拳匪直也。<br /><br />
</td></tr>
