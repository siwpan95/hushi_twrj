<tr><td class="t50">一九一二年十月廿七日（星期）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　晨，赴康福先生经课，讲保罗悔过改行一节。其言曰：保罗改过之勇为不可及。然Ananias知保罗怀叵测之心以来，将得新教之徒而甘心焉，乃敢坦然往见保罗，说以大义，则其人诚独为其难，尤不可及也。此说甚新，予读此节时，乃未思及此，何也？<br /><br />
　　下午作文。夜读上星期报纸所记三大政党之事，摘为报告，为明日之用。<br /><br />
