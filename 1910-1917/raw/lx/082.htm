<tr><td class="t50">一九一一年四月十七日（星一）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上课。作植物学笔记。读<i>Minna</i>。<br /><br />
　　今日已为吾国三月十九日，春莫矣，此间犹有雪，天寒至冰点以下。<i>Browning</i>诗曰：<br /><br />
　　Oh, to be in England<br /><br />
　　Now that April's there.<br /><br />
　　〔中译〕<br /><br />
　　啊，英格兰已是四月<br /><br />
　　该回去了。<br /><br />
　　读之令人思吾故国不已。<br /><br />
