<tr><td class="t50">卷三 八、读Synge短剧</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月十一日）<br /><br />
　　昨今两日，读爱尔兰近代戏曲巨子J. M. Synge（绅吉）（1817—1909）短剧二本：<br /><br />
　　1． <i>Riders to the sea</i>.（《向海延伸的山脉》）<br /><br />
　　2． <i>In the Shadow of the Glen</i>.（《在峡谷的阴影下》）<br /><br />
　　写爱尔兰贫民状况极动人。其第一剧尤佳，写海滨一贫家，六子皆相继死于水，其母老病哀恸，絮语呜咽，令人不忍卒读，真绝作也。<br /><br />
