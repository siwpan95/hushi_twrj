<tr><td>
<br />
　　上课。<br /><br />
　　连日以Bland在各地演说，吾国学生都愤激不平，波市与纽约均有书来议进行之方，抑制之策。今日吾国学生会开特别会议事，余建议举一通信部，译英美各报反对吾国之言论，以告国中各报，以警吾国人士，冀可稍除党见之争，利禄之私，而为国家作救亡之计。<br /><br />
