<tr><td class="t50">卷三 三〇、但怒刚死事情形</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿五日）<br /><br />
　　怒刚之死，言之惨然！而其死事情形尤有可恸者：盖渝中举事后，怒刚即督师外出，西上取成都，连战皆捷，已逼至资阳，距成都仅二百余里。更分兵南上围泸州，进攻富顺，亦均获胜利，旦夕即下。不意以种种原因，渝中执事者先遁，根本遂失。是时怒刚方驻永川，前锋闻渝中消息，不战而退。后方根本已失，无所归依，怒刚乃有自戕之举。闻其死时，其麾下尚千余人。<br /><br />
　　此杨伯谦君寄书叙但怒刚死事之状，读之令我数日不乐。<br /><br />
