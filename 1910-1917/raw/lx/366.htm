<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月九日）<br /><br />
　　读《外观报》论爱耳兰Ulster省反抗与英分离事，读竟，于此问题之始末十得八九。因念此邦杂志太多，不能尽读，如每日能读一篇，得其大概，胜于翻阅全册随手置之多矣，胜读小说多矣，前此每得杂志，乱翻一过，辄复置之，真是失计。<br /><br />
