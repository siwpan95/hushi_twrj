<tr><td class="jz">
<hr />

<tr><td>
<br />
　　读Plato's <i>Apology of Socrates</i>。<br /><br />
　　今日为美国独立纪念日，夜八时至湖上观此间庆祝会。士女来游者无算，公园中百戏俱陈，小儿女燃花爆为乐。既而焰火作矣，五光十色，备极精巧。九时半始归。<br /><br />
