<br />
　　上课：心理学。第一课讲师Prof. Titchener为心理学巨子之一，所著书各国争译之。<br /><br />
　　世界大同会总会书记Louis P. Lochner君自麦狄森来。此君以会事故，与余早已有书往来。今始于此相见，执手言欢，快慰之至。<br /><br />
　　夜世界会开会欢迎Lochner君，即以送总会长George W. Nasmyth君往游欧洲。二君皆有演说。<br /><br />
　　送Lochner君登车往纽约。<br /><br />
