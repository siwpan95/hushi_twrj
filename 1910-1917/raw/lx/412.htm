<tr><td class="t50">卷三 五一、死矣赵秉钧</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月廿七日）<br /><br />
　　英文报载直督赵秉钧二月廿七日暴死，人皆疑为被人用毒药暗杀。<br /><br />
　　此案之诡谲，可谓极矣！凶手武士英死于上海狱中，应氏死于火车中，今赵氏复以毒死。继赵氏而死者谁耶？<br /><br />
