<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　野外实习至南山，教师谓此地四千万年前尚为大海，汪洋无际，今考山石尚多介族化石之遗，山石分层，序次井然，非一川一渎之所能成也。闻之感慨世变，喟然兴思。<br /><br />
