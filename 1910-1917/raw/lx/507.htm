<hr />

<tr><td>
<br />
　　（八月九日）<br /><br />
　　昨日读易卜生名剧《海妲传》（<i>Hedda Gabler</i>），极喜之。此书非问题剧也，但写生耳。海妲为世界文学中第一女蜮，其可畏之手段，较之萧氏之麦克伯妃（Lady 
Macbeth）但有过之而无不及也。<br /><br />
