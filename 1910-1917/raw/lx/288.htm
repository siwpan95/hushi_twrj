<tr><td class="t50">一九一二年十月四日（星五）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上课。夜有世界会董事会。作报告。读心理学，此书文笔畅而洁，佳作也。<br /><br />
　　是日，上午有Prof. N. 
Schmidt演说《石器时代之人类》，辅以投影画片，写人类草昧之初种种生活状态，观之令人惊叹。吾人之祖宗，万年以来，种种创造，种种进化，以成今日之世界，真是绝大伟绩，不可忘也。今年大学文艺院特请校中有名之教师四人每星期演讲一次，总目为《文明之史》，自草昧之初以迄近世，最足增人见闻，当每次往听之。<br /><br />
</td></tr>
