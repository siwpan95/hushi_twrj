<tr><td class="t50">卷五 二二、印度无族姓之制</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月二十日）<br /><br />
　　与印度人某君谈，其人告我，印度无有族姓之制，其人但有名无姓氏也。其继承之次，如父名约翰·约瑟·马太，则其子名约瑟·马太·李却，李却为新名，其前二名则父名也；其孙则名李却·腓力·查尔斯；其曾孙则名腓力·查尔斯·维廉，以此类推去。<br /><br />
</td></tr>
