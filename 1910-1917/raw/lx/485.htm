<tr><td>
<br />
　　（七月十八日）<br /><br />
　　自伊卜生（Ibsen）以来，欧洲戏剧巨子多重社会剧，又名“问题剧”（Problem 
Play），以其每剧意在讨论今日社会重要之问题也。业此最著者，在昔有伊卜生（挪威人），今死矣，今日名手在德为赫氏，在英为萧伯纳氏（Bernard 
Shaw），在法为白里而氏。<br /><br />
