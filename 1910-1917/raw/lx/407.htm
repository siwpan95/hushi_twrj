<tr><td class="t50">卷三 四六、一种实地试验之国文教授法</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月九日）<br /><br />
　　有友人Wm. F. Edgerton思习汉文，余因授之读。其法先以今文示之，下注古篆，如日（⊙）月（<img alt="胡适留学日记" src="t18.png" width="19" height="20" />）之类。先授以单简之榦子。榦字者（root），语之根也。先从象形入手，次及会意，指事，以至于谐声。此是一种实地试验之国文教授法。若吾能以施诸此君而有效，则他日归国，亦可以施诸吾国初学也。一举而可收识义及寻源之效，不愈于绘图插画乎？<br /><br />
