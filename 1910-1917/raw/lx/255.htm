<tr><td>
<br />
　　上课。下午看影戏，有科学片《花的生长》（<i>The Growth of Flowers</i>），真妙不可言；又有Cornell景物写真，亦可观。<br /><br />
　　夜学生会第一次会，新职员为金涛、刘仲端、林亮功、程义藻等。会毕访邹树文，归见月色甚佳，心神为之怡悦无已。<br /><br />
