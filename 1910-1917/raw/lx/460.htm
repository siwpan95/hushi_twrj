<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月卅日）<br /><br />
　　与某君言旧日官僚结怨已深，今日宜有以自赎，曩所积财，宜有以善用之以利民淑世。因举二事：一兴学校，一开报馆，皆是好事，有力者不可不为。若徒拥多金，譬之髙卧积薪之上，旦夕可焚，不可久也。<br /><br />
