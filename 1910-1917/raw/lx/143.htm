<tr><td class="t50">一九一一年六月十七日（星六）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　第四日：经课。讨论会，题为《孔教之效果》，李佳白君主讲，已为一耻矣，既终，有Dr. 
Beach言，君等今日有大患，即无人研求旧学是也。此君乃大称朱子之功，余闻之，如芒在背焉。Mr. T. R. 
White演说《国际和平》（International Peace）。下午为欢迎茶会。夜会。<br /><br />
　　得希吕一书。<br /><br />
