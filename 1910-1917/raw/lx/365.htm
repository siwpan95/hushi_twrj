<tr><td class="t50">卷三 四、“博学铁匠”巴立特</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月八日）<br /><br />
　　是日读巴立特（Elihu 
Burritt，1811—1879）事迹及所著书，此人亦怪才也。幼贫为锻工，仅入学六月，而苦读不辍，年三十能读五十国文字，遂惊一世，称博学铁匠焉（The 
Learned 
Blacksmith）。三十以后，演说著书，持世界和平主义甚力，南北美黑奴问题之起，君主放奴赎奴之说，传檄遍国中。其人慷慨好义，行善若渴，固不特以语学名也。<br /><br />
</td></tr>
