　　上课。<br /><br />
　　理学会嘱予预备一短篇演说，述吾国子女与父母之关系，诺焉。是夜予演说十五分钟，有 Prof. G. L. Burr and Prof. N. Schmidt 
二君稍质问一二事。Prof. Purr以予颇訾议美国子女不养父母，故辨其诬。亦有人谓吾言实不诬者。此种讨论甚有趣，又可增益见闻不少。<br /><br />
