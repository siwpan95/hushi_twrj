<tr><td>
<br />
　　晨，赴康福先生经课。<br /><br />
　　下午，作读报报告。与法垒诸人同出散步，行至四英里之长始归。<br /><br />
　　夜续作报告，见有Homer Lee之死耗（十一月一日）。此君为孙中山作军事参谋，闻为革命事效力不少，今民国告成而此君死矣！此君著有一书名 <i>The 
Valor of Ignorance</i>，甚风行一时。<br /><br />
