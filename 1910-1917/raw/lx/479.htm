<tr><td class="t50">卷五 一〇、《哀希腊歌》译稿</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月十三日）<br /><br />
　　写所译裴伦《哀希腊歌》，不能作序，因作《译馀剩墨》数则弁之。其一则论译诗择体之难，略曰：“译诗者，命意已为原文所限，若更限于体裁，则动辄掣肘，决不能得愜心之作也。”此意乃阅历所得，译诗者不可不理会。<br /><br />
　　写此本成，叔永为作序，复附君武、曼殊两家译本以寄怡荪，令印行之。怡荪方在筹款为学费，故即以此册赠之。售稿所得，虽未必能多，然故人力所能及仅有此耳。<br /><br />
</td></tr>
