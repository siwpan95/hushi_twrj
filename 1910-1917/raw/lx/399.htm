<tr><td class="t50">卷三 三八、壁上格言</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿八日）<br /><br />
　　余壁有格言云：<br /><br />
　　“If you can't say it out loud，keep your mouth shut.”（如果不敢高声言之，则不如闭口勿言也。）<br /><br />
　　此不知何人之言，予于书肆中见此帖，有所感触，携归，悬壁上，二年余矣。此与孔子“知之为知之，不知为不知，是知也”同意。不敢高声言之者，以其无真知灼见也。余年来演说论学，都奉此言为圭臬，虽有时或不能做到，然终未敢妄言无当，尤不敢大言不惭，则此一语之效也。<br /><br />
