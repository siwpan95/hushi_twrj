<tr><td class="t50">卷三 四七、《说文》有许多字不满人意</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月九日）<br /><br />
　　《说文》有许多字不满人意：<br /><br />
　　大<br /><br />
　　分明是人形手足满引。以示大之义。如《说文》“天大地大”云云，乃后人附会之词，初民不能作此种哲学语也。<br /><br />
　　天<br /><br />
　　像人上之物，尊之也。<br /><br />
　　王<br /><br />
　　像土上有物，示土地之主之意。《说文》引董仲舒之说，亦书生之谈，初民不能有此种思想也。<br /><br />
　　玉<br /><br />
　　当从古文“<img alt="胡适留学日记" src="t19.png" width="17" height="18" />”，王者所佩，贵之也。许氏注玉字作十数语，多而无当，是汉人说经大病。<br /><br />
</td></tr>
