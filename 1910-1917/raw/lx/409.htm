<tr><td class="t50">卷三 四八、英国布商之言</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月十四日）<br /><br />
　　有英国布商二人（Laurie and 
Mackenzie，Edinburgh）往来英美各城，专售羊毛绒货，适来此间兜售货物，余遇之，因与谈。其人所操英语，字字句句都温文儒雅，虽在此邦大学教师中，亦不可多闻此种英语。余因告以此意。其人初颇谦逊，继见余意诚，因语余曰：“此邦人士之知识初不让他国，惟于言语则终不肯修饰，其有能作上流言语者，则人争腹诽之，以为高傲自异于凡俗也，岂不可慨！”此言是也。<br /><br />
</td></tr>
