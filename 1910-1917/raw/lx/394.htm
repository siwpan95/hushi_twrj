<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿五日）<br /><br />
　　余近来读书多所涉猎而不专精，泛滥无方而无所专注，所得皆皮毛也，可以入世而不足以用世，可以欺人而无以益人，可以自欺而非所以自修也。后此宜痛改之。<br /><br />
