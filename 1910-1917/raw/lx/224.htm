<tr><td class="t50">一九一一年九月六日（星三）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　主妇大可恶，几致与之口角。此妇亦殊有才干，惟视此屋为一营业，故视一钱如命，为可嗤耳。<br /><br />
　　今日，迁居世界学生会所。初次离群索居，殊觉凄冷。<br /><br />
　　昨日，与金涛君相戒不复打牌。<br /><br />
