<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今日为校中所谓“春朝”（Spring Day）假期。赴Spring Day会场。<br /><br />
　　下午，读英文诗数家。<br /><br />
　　是日，本校与哈佛（Harvard）竞舟，与耶而（Yale）竞球，皆大胜；又参与美国全国运动大赛（Track），亦大胜；尚有小竞皆胜：计一日而七捷，此间士女喜欲狂矣。<br /><br />
