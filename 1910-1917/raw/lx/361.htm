　　民国二年（1913）四月至三年（1914）二月廿八日<br /><br />
　　（在康乃耳大学）<br /><br />
　　吾作日记数年，今不幸中辍，已无可复补；今以札记代之：有事则记，有所感则记，有所著述亦记之，读书有所得亦记之，有所游观亦略述之。自传则吾岂敢，亦以备他日昆弟友朋省览焉耳。<br /><br />
　　（民国二年四月）<br /><br />
