<tr><td class="t50">卷四 四二、黄监督不准学生暑期上课</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月廿九日）<br /><br />
　　黄监督（鼎）忽发通告与各大学，言赔款学生，非绝对必要时，不得习夏课。昨本校注册司抄此通告数份，令张挂世界学生会会所。下午，余偶入校，见注册司门上窗上皆粘此示。夜遇教长班斯先生，亦以此为问，以为闻所未闻。此真可笑之举动！夫学生之不乐荒嬉而欲以暇时习夏课，政府正宜奖励之，乃从而禁止之，不亦骇人听闻之甚者乎？<br /><br />
</td></tr>
