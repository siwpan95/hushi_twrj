<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　读爱麦生文（Emerson's Essays）。读《五尺丛书》中之“Tales”，此书如吾国之《搜神述异》，古代小说之遗也。连日无事，极无聊，故读之。<br /><br />
　　此间国人十去其九，皆赴中国东美学生会者也。<br /><br />
