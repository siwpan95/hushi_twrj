<tr><td class="t50">卷三 一七、假期中之消遣</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月廿三日）<br /><br />
　　在假期中，寂寞无可聊赖，任叔永、杨杏佛二君在余室，因共煮茶夜话，戏联句，成七古一首，亦殊有趣，极欢始散。明日余开一茶会，邀叔永、杏佛、仲藩、钟英、元任、宪先、垕生、周仁、荷生诸君同叙，烹龙井茶，备糕饼数事和之；复为射覆，谜语，猜物诸戏。余拟数谜，颇自喜，录之如下：<br /><br />
　　<img alt="胡适留学日记" src="t10.png" width="546" height="156" /><br /><br />
　　此等游戏，虽本无可记之价值，惟吾辈去国日久，国学疏废都尽，值兹佳节，偶一搜索枯肠，为消忧之计，未尝不稍胜于博弈无所用心者之为也。<br /><br />
