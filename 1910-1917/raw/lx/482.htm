<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月十七日）<br /><br />
　　有人赠我莎士比亚名剧《亨利第五》，全书三百八十余页，用薄纸印之，故全书仅广寸有半，长二寸，厚不及半寸（英度），取携最便，因以置衣囊中，平日不读之，惟于厕上及电车中读之，约一月而读毕，此亦利用废弃光阴之一法也。<br /><br />
