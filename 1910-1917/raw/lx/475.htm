<tr><td class="t50">卷五 六、美国驻希腊公使义愤弃官</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月十二日）<br /><br />
　　巴尔干两次血战之后，欧洲列强出而干涉，割阿尔巴尼亚之地，立为独立国，令卫得王（Wild）王之。卫得庸暗，国人内乱。美国驻希腊公使George Fred 
Williams特至其国访查，见其政府之暗黑，人民之受压制，教派之纷争，慨然大愤，即为文告天下，弃官去，誓将助阿之新党，推翻现有之政府。此种义愤之举，在今日殊不可多得，故记之。<br /><br />
