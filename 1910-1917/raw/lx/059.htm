　　得保民书，以一书复之。<br /><br />
　　余前评《赖芬传》（W. D. Howells'<i>The Rise of Silas Lapham</i>），以为书名《振起》（Rise），而其中事实，皆言赖芬衰落之状，书名殆指其人格之进境（Rise）也。今日教员宣读著者Howells来书，正是此意，余不禁为之狂喜。<br /><br />
