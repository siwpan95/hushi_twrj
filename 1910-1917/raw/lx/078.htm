<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上课。<br /><br />
　　读《召南·邶风》。汉儒解经之谬，未有如《诗》笺之甚者矣。盖诗之为物，本乎天性，发乎情之不容已。诗者，天趣也。汉儒寻章摘句，天趣尽湮，安可言诗？而数千年来，率因其说，坐令千古至文，尽成糟粕，可不痛哉？故余读《诗》，推翻毛传，唾弃郑笺，土苴孔疏，一以己意为造《今笺新注》。自信此笺果成，当令《三百篇》放大光明，永永不朽，非自夸也。<br /><br />
