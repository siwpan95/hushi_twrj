<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　吾国学生会已毕，自今日为始吾辈留此为美国学生会之客。<br /><br />
　　外出散步。看打棒球。<br /><br />
　　是日早晚俱有讲道会。<br /><br />
　　有Elkington者，为此间地主，曾至中国，现招吾辈明日往游其家。<br /><br />
