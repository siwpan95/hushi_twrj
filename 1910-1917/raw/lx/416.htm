<tr><td>
<br />
　　（三月十二日）<br /><br />
　　余前为《大共和日报》作文，以为养家之计，今久不作矣。此亦有二故：一则太忙，二则吾与《大共和日报》宗旨大相背驰，不乐为作文也。惟吾久不得钱寄家，每得家书，未尝不焦灼万状，然实无可为计。今图二策，一面借一款寄家而按月分还此款，一面向大学请一毕业生助学金（Scholarship）。二者皆非所乐为也，而以吾家之故不能不为之。<br /><br />
</td></tr>
