<tr><td class="t50">卷三 三二、今日吾国急需之三术</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿五日）<br /><br />
　　今日吾国之急需，不在新奇之学说，高深之哲理，而在所以求学论事观物经国之术。以吾所见言之，有三术焉，皆起死之神丹也：<br /><br />
　　一曰归纳的理论，二曰历史的眼光，三曰进化的观念。<br /><br />
