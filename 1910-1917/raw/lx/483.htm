<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月十八日）<br /><br />
　　发起一会曰读书会，会员每周最少须读英文文学书一部，每周之末日相聚讨论一次。会员不多，其名如下：<br /><br />
　　任鸿雋、梅光迪、张耘、郭荫棠、胡适<br /><br />
　　余第一周所读二书：<br /><br />
　　Hawthorne: <i>The House of Seven Gables</i>.<br /><br />
　　Hauptmann: <i>Before Dawn</i>.<br /><br />
