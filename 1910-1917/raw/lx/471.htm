<tr><td class="t50">卷五 二、爱迪生拜蜜蜂做老师</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月八日）<br /><br />
　　爱迪生（Thomas Edison）近来拜了一只蜜蜂作老师。他观察了那蜜蜂的活动，有这样的报告：<br /><br />
　　如果我们能有一件东西可以每秒钟扇动空气二百次，我们就能造出一只真正的飞机，能造出一只比空气重的大飞机。这蜂的身体比他的两翅重七千倍。只要能做到这一点，就行了，就行了！这蜂的两翅扇动空气每秒钟三百次。<br /><br />
　　右〔上〕一则见 <i>Outlook</i>杂志。<br /><br />
