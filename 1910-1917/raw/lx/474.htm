<tr><td class="t50">卷五 五、美国亦有求雨之举</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月十二日）<br /><br />
　　天地之大，何奇不有。欧美科学之发达，可谓登峰造极矣；科学知识之普及可谓家喻户晓矣；而犹有求雨之举。吾去年闻西美某省长出令，令省中各教堂同日祈祷求雨，今又见之。甚矣，习俗之入人深而迷信之不易破除也！吾国政府乃至下令乞耶教徒为吾国祈福。祈福求雨，更有何别？然祈祷为教宗重要仪节之一。耶回信徒日日祈祷，吾每礼拜日见此邦人士祈祷乃不以为异，而独异求雨，彼求雨者与彼礼拜堂中济济士女之低首祈福者，容有上下床之别乎？吾是以不禁自笑吾陋也。<br /><br />
</td></tr>
