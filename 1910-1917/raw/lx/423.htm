<tr><td class="t50">卷四 八、入春又雪因和前诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月十一日）<br /><br />
　　入春忽又大寒，亦雪，遥林粉本，复珊珊如故，因和前诗：<br /><br />
　　无复汙流涨小渠，但看飞雪压新芜。<br />
　　东风不负诗人约，还我遥林粉本图。<br /><br />
　　诗成，一日而雪消图散，不可复睹。春雪之易销如此，其积不厚也。<br /><br />
