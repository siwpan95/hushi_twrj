<tr><td>
<br />
　　（八月十日）<br /><br />
　　今日有人投书本市日报，论爱国与是非，其人不署名，乃引孔子之言以申吾说（参看卷四第一五则，卷五第九则，第二八则），所引乃“所谓大臣者，以道事君，不可则止”（《先进篇》）一语也。<br /><br />
