<tr><td class="t50">一九一二年十一月二日（星六）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上午上课。看本校与哈佛大学长途赛跑，第一人为J. P. Jones，本校学生，然总计分数（52～55）本校乃不如哈佛。<br /><br />
　　下午读书。小睡。是日始雪。<br /><br />
　　夜往访L. E. Patterson之家，夜深始归。<br /><br />
　　是夜偶谈及Free Mason（吾国译“规矩会”）之原委始末。<br /><br />
