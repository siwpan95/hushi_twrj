<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上课：伦理学。英文。美术史。中古史。<br /><br />
　　英文课，予初意在学作高等之文，今日上课，始知此科所授多重在写景记事之文，于吾求作论辩之文之旨不合，遂弃去。<br /><br />
　　美术史一科甚有趣。教师Brauner先生工油画，讲授时以投影灯照古代名画以证之。今日所讲乃最古时代之美术，自冰鹿时代（Reindeer 
Stage约耶纪元前八九千年）以至埃及、巴比伦，增长见闻不少。<br /><br />
