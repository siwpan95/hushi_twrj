<tr><td class="t50">卷四 五、雪消记所见并杨任二君和诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月廿五日）<br /><br />
　　雪消记所见　（久不作近体诗矣）<br /><br />
　　春暖雪消水作渠，万山积素一时无。<br />
　　欲檄东风讨春罪，夺我寒林粉本图。<br /><br />
　　杨杏佛见此诗而和之曰：<br /><br />
　　潺潺流水满沟渠，漠漠林烟淡欲无。<br />
　　归思欲随芳草发，江南三月断魂图。<br /><br />
　　任叔永亦和二首，兼简曾槭子：<br /><br />
　　料峭冬寒一日除，氈裘新卸觉轻舒。<br />
　　惠连死去情怀减，春草池塘梦更无。<br /><br />
　　故人书共东风至，驱寒添暖未嫌迟。<br />
　　斜日小窗摊卷坐，最忆泉声作雨诗。<br /><br />
