<tr><td>
<br />
　　（三月八日）<br /><br />
　　吾归国后，每至一地，必提倡一公共藏书楼。在里则将建绩溪阅书社，在外则将建皖南藏书楼、安徽藏书楼。然后推而广之，乃提倡一中华民国国立藏书楼，以比英之British 
Museum，法之Bibliotheque National，美之Library of Congress，亦报国之一端也。<br /><br />
