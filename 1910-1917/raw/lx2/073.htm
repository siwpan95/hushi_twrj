<td class="t50">卷七 四一、世界大同之障碍</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月十七日）<br /><br />
　　一日，与本市监理会派教堂牧师John A. 
Macintosh先生谈，余为言今日世界物质上已成一家，航路，电线，铁道，无线电，海底电，皆团结全世界之利器也，而终不能致“大同”之治者，徒以精神上未能统一耳，徒以狭义之国家主义及种族成见为之畛畦耳。先生亦以为然，因引保罗书中言相发明：<br /><br />
　　但属灵的不在先，属血气的在先，以后才有属灵的。<br /><br />
　　——《哥林多前书》第十五章四十六节<br /><br />
