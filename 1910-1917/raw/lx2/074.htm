<td class="t50">卷七 四二、读《墨子》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月廿二日）<br /><br />
　　连日读《墨子》，颇有所得。昨日以一日夜之力作一文论墨子之哲学，分四章：<br /><br />
　　（一）墨子传及墨学小史<br /><br />
　　（二）实利主义<br /><br />
　　（三）兼爱说<br /><br />
　　（四）非攻说<br /><br />
　　共写三十页，手不停书，铁笔为秃。今夜在哲学会读之，颇受欢迎。《墨子》之《经上》、《经下》、《经说上、下》、《大取》、《小取》六篇含有无数精义，尚未能细心研究，他日当继续为之。<br /><br />
</td></tr>
