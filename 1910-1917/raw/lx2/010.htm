<td class="t50">卷六 一〇、赴苛勿演说</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月十六日）<br /><br />
　　去此十五英里有村曰苛勿（Covert）。村中教堂牧师吉不生君（Gibson）延余往彼教堂中演说，所演为“中国之妇人”。吉君又延余为彼经课班演说。余令班中人质问所欲知而一一答之。吉君以汽车迎余，早行湖上，湖面风静，水光如镜，朝日在天，空气清洁无伦，风景极佳。<br /><br />
