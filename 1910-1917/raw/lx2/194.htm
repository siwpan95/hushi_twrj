<td class="t50">卷九 七七、山谷词带土音</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月七日）<br /><br />
　　山谷有《洞仙歌》一阕，所用韵为：<br /><br />
　　老　草　昼　守　棹　斗<br /><br />
　　此诸韵不相通也。山谷，江西人，疑是江西土音耳。吾绩溪土音读肴、豪韵如尤韵。而尤韵中字乃有二种决不相同，如“尤”“由”“游”“休”诸字为一类（母音如法文之ieu），而“侯”“留”“楼”“舟”“愁”，仄声之“昼”“守”“手”“斗”“酒”诸字，另为一类（母音略如英文之ě），歙县之音则全韵皆作尤韵，故与肴、豪通也。<br /><br />
</td></tr>
