<td class="t50">卷九 七一、日本议会中在野党攻击政府</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月三日）<br /><br />
　　报载昨日日本议会中在野党提出不信任政府之议案，谓政府之对华外交政策为完全失败，既损害对华友谊，又引起列强嫉视，实大损帝国之威信，且种下将来恶因。<br /><br />
　　此为晚近新闻中之最足鼓舞吾之乐观者。勿谓秦无人也！勿谓秦无人也！<br /><br />
　　〔附记〕此议案未能通过，赞成者一百三十三人，反对者二百三十二人。余明知其未能通过也，然主此说者已过全议会三分之一，不为少矣。（三日下午又记）<br /><br />
