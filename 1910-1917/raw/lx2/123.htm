<td class="t50">卷九 六、范鸿仙</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月廿二）<br /><br />
　　《民国报》第六号来，中有近来政府所暗杀及捕杀之民党若干人之遗像，其一人乃吾友范鸿仙（光启）也。戊申余在上海时，李辛伯、李警众及鸿仙创《安徽白话报》，余始识鸿仙。后鸿仙助于右任办《民呼》、《民吁》、《民立》各报。去年居上海，有贼数人夜攻其居，君身受四创而死。呜呼！惨矣！<br /><br />
　　<img alt="胡适留学日记" src="t17.jpg" width="219" height="376" /><br /><br />
　　范鸿仙（1882—1914）<br /><br />
