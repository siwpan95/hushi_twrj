<td class="t50">卷六 二〇、欧战之罪魁祸首</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月廿四日）<br /><br />
　　昨日，《纽约时报》刊行英国外部关于欧洲大战之来往函电一百五十九件，读之一字不肯放过，其兴味之浓，远胜市上新小说也。此种文件，皆确实可靠。据吾所观，则奥为祸首，德阴助之以怒俄。奥无德援，决不敢侮俄也，则德罪尤大耳。英外相葛雷（Sir 
Edward Grey）始终坚持和平之议，而德袖手不为之援。及八月之初，奥已有俯就羁勒之意，而德人已与俄法宣战矣。<br /><br />
