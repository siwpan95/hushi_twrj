<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月十二日）<br /><br />
　　二月六日份之<i>The New 
Republic</i>有投函人自称“支那一友”，其书论远东时局，以为日本之在中国占优胜，未始非中国之福。又言，“中国共和已完全失败，中国人不适于自治，日本之干涉，可使中国有良政府，中国之福，列强之福。……”读之大不满意，作一书驳之（参看卷九第九则）。<br /><br />
