<td class="t50">卷九 三五、雾中望落日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月廿五日）<br /><br />
　　尼格拉飞瀑上流长河受诸大湖之冰，积水面，自岸上望之，气象佳绝。是日下午天大热，冰稍解，水气蒸为重雾。雾中望落日，其大无匹。吾生平见日未尝有如此次之大者也。<br /><br />
