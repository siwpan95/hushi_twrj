<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月十六日）<br /><br />
　　昨夜读一小说<i>David Harum</i>，by Edward Noyes Westcott（1899，Appleton，N. 
Y.），写此邦风土人物甚生动，深喜之。久不读长篇小说矣，以其费时也。哲学教员客雷敦（J. E. 
Creighton）之夫人称此书于余，且以此册相假；故以暇时读之。<br /><br />
