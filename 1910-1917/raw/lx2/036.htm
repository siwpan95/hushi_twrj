<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月廿八日）<br /><br />
　　仲藩归国，道中寄一片曰：“足下有暇，可研究耶教后圣派（Church of Jesus Christ of the Latter 
Saints），即俗所谓木尔门（Mormon）派，他日能告我以十九世纪之文明而此派乃能勃兴于是时者，何也？”此意甚有研究之价值，先记之。
<br /><br />
