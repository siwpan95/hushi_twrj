<td class="t50">卷八 二一、“室中摄影”两帧</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月六日）<br /><br />
　　吾喜摄影而不能工，以不能多费时日于此也。近得二影，皆室中所摄，颇不恶：<br /><br />
　　一为室中书架之图。架上“薛克莱曼”花（Cyclamen）一盆，乃元旦日某所赠物。今花将残萎，故及其未落，为作此图。架上小影，乃故人亥叟遗像也。<br /><br />
　　一为哈佛世界会午餐之图。余在康桥时，哈佛支会职员招余餐于哈佛大餐室之别室，席终，纳博士以余所携摄影器为摄此影。此影光影得宜，大有画意，可谓佳作，不独为四海兄弟一时胜集之纪念已也。<br /><br />
