<td class="t50">卷九 六一、狄女士论俄、美大学生</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月廿一日）<br /><br />
　　吾友狄泊特女士（Barbara Vital De 
Porte），俄国人，尝肄业俄国女子高等学院，今随其兄（在此教算学）居此。一日，女士谓余曰：“此邦之大学学生多浮浅，无高尚思想，不如俄国学生之具思想，富胆力，热心国事，奔走尽瘁之可敬也。”余极以为然，吾曩论此邦学生亦持此说（参看卷八第三一则）。女士居此，日服劳五时以自给，而学课所需时力不与焉，可敬也已。<br /><br />
