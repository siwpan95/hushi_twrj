<td class="t50">卷九 一一、致张亦农书</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月三日）<br /><br />
　　足下以无用责政府，不知若令足下作外交长官又何以处之？战耶？国家之事，病根深矣，非一朝一夕之故，亦非一言两语所能尽。今日大患，在于学子不肯深思远虑，平日一无所预备。及外患之来，始惊扰无措，或发急电，或作长函，或痛哭而陈词，或慷慨而自杀，徒乱心绪，何补实际？至于责人无已，尤非忠恕之道。吾辈远去祖国，爱莫能助，当以镇静处之，庶不失大国国民风度耳。<br /><br />
