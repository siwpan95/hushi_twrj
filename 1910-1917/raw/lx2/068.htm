　　（十一月十四日）<br /><br />
　　读英人大卫氏（Sir John Francis 
Davis）所译元剧《汉宫秋》。此书原本余未之见，乃先读译本，真所谓隔靴搔痒者也。此剧是完全哀剧。即以译本论，其布局殊得剧家神意。<br /><br />
