<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月七日）<br /><br />
　　吾友韩人金铉九君自西美来此，力作自给，卒不能撑持，遂决计暂时辍学，他往工作，俟有所积蓄，然后重理学业，今夜来告别，执手黯然。<br /><br />
　　韩人对于吾国期望甚切，今我自顾且不暇，负韩人矣。<br /><br />
