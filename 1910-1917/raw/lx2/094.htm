<td class="t50">卷八 九、裴立先生对余前二诗之指正</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月七日追记）<br /><br />
　　夜往见前农院院长裴立先生（Liberty Hyde 
Bailey）。先生为此邦农学泰斗，著书真足等身，有暇则为诗歌，亦极可诵。余以所作二诗乞正。先生以第一诗为佳作；第二诗末六句太弱，谓命意甚佳，可改作；用他体较易发挥，“桑纳”体太拘，不适用也。<br /><br />
</td></tr>
