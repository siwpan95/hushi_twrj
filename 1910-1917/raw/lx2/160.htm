<td class="t50">卷九 四三、抵制日货</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月三日）<br /><br />
　　东京及祖国书来，皆言抵制日货颇见实行，此亦可喜。抵制日货，乃最适宜之抗拒，吾所谓道义的抗拒之一种也。不得已而求其次，其在斯乎？<br /><br />
　　或问“何谓不得已而求其次”？答曰：“上策为积极的进行，人人努力为将来计，为百世计，所谓求三年之艾者是也。必不得已而求目前抗拒之策，则抵制日货是已。若并此而不能行，犹侈言战日，可谓狂吠也已！”<br /><br />
</td></tr>
