<td class="t50">卷八 二、金仲藩来书</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月十三日）<br /><br />
　　金仲藩有书来云：<br /><br />
　　国势危殆，民情浑沌，仍无异我五年前未去国之时。……我国情去共和资格远甚远甚，百人中不可得一人识书字，千人中不能得一人可与道常识，百万人中不必得一人可与言外情，达治理。众愚如此，吾诚不知与谁言共和也！即真得共和矣，亦数十人之共和，而非民国之共和也。……<br /><br />
　　中央政治，近以外势逼迫，稍有清明气象。内国公债十六兆元满额，亦为人民稍有信任政府之心之征。……<br /><br />
