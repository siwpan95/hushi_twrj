<td class="t50">卷九 四一、书怀</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月一日）<br /><br />
　　叔永有《春日书怀》诗见示，索诗相和，率成一律，用原韵：<br /><br />
　　甫能非攻师墨翟，已令俗士称郭开。<br /><br />
　　高谈好辩吾何敢？回天填海心难灰。<br /><br />
　　未可心醉凌烟阁，亦勿梦筑黄金台。<br /><br />
　　时危群贤各有责，且复努力不须哀。<br /><br />
　　余最恨律诗，此诗以古诗法入律，不为格律所限，故颇能以律诗说理耳。<br /><br />
