<td class="t50">卷八 八、善于施财之富翁</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月六日）<br /><br />
　　偶见报载此一则，以其甚有趣，故录之：<br /><br />
　　郁太省的一个富人能君（L. L. 
Nunn），有一天，在国会参议院旁听楼上旁听，看见一个童役（Page），引起了他的注意。他留心访察，询知其人年十四，名Clyde 
Barley，能君即资送他到康乃耳大学，供他四年用费。据参议员某君说，能君资助在康乃耳大学毕业者已近五十人，都是他旅行全国时随时留意所得。<br /><br />
　　此人奇处不在好施财，乃在其随地留意人才而助之。<br /><br />
