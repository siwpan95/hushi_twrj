<br />
　　（八月廿五日）<br /><br />
　　昨夜译法国都德（Daudet）著短篇小说《柏林之围》（<i>Le Siège de Berlin</i>）寄与《甲寅》。此君之《最后一课》（<i>La Dérniere 
Clásse</i>）余已译之；改名《割地》，载《大共和》。此两篇皆记普法战事（一八七〇—一八七一）。<br /><br />
