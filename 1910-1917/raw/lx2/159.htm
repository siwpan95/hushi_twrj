<td class="t50">卷九 四二、留日学界之日本观</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月二日）<br /><br />
　　吾前此曾发愿研究日本之文明，偶以此意告叔永，嘱叔永为购文法书应用。叔永转托邓胥功，告以余所以欲习日文之意。邓君寄书二册，而媵以书，略云：“日本文化一无足道：以综而言，则天皇至尊；以分而言，则男盗女娼。”又注云：“此二语自谓得日人真相，盖阅历之言。”嗟乎！此言而果代表留日学界也，则中日之交恶，与夫吾国外交之昏暗也，不亦宜乎？<br /><br />
