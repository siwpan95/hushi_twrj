<td class="t50">卷九 一三、吾国各省之岁出</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月四日）<br /><br />
　　昨日报记哥伦比亚大学今年岁出预算为3,897,350元，盖合吾国银元约800万元。据晚近报告，吾国各省岁出如下表：<br /><br />
　　<img alt="胡适留学日记" src="t19.jpg" width="521" height="316" /><br /><br />
　　此大学一年之岁出，超出晋、陕、甘、豫、新、湘、皖、赣、浙、闽、桂、贵诸省之上。<br /><br />
　　二十二省岁出合计：约185,000,000银元，合美金盖9,200余万元。此邦去年海军费约133,300,000元，陆军费约160,400,000。盖吾二十二省之岁出总数，犹不足供此邦常年海军费。<br /><br />
