<td class="t50">卷九 三八、《老树行》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月廿六日）<br /><br />
　　道旁老树吾所思，躯干十抱龙髯枝，蔼然俯视长林卑！<br /><br />
　　冬风挟雪卷地起，撼树兀兀不可止，行人疾走敢仰视！<br /><br />
　　春回百禽还来归，枝头好音天籁奇，谓卿高唱我和之。<br /><br />
　　狂风好鸟年年事，既鸟语所不能媚，亦不为风易高致。<br /><br />
　　〔自跋〕<br /><br />
　　此诗用三句转韵体，虽非佳构，然末二语决非今日诗人所敢道也。<br /><br />
