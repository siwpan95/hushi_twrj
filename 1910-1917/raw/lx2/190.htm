<td class="t50">卷九 七三、秦少游词</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月六日）<br /><br />
　　秦少游词亦有佳语：<br /><br />
　　《满庭芳》<br /><br />
　　高台芳榭，飞燕蹴红英。舞困榆钱自落。秋千外，绿水桥平。<br /><br />
　　《好事近》（梦中作）<br /><br />
　　飞云当面化龙蛇，夭矫转空碧。醉卧古藤阴下，了不知南北。<br /><br />
　　《金明池》<br /><br />
　　更水绕人家，桥当门巷，燕燕莺莺飞舞。<br /><br />
　　莺燕本双声字，叠用之音调甚佳。<br /><br />
　　又《八六子》前半阕云：<br /><br />
　　倚危亭，恨如芳草，萋萋刬尽还生，念柳外青骢别后，水边红袂分时，怆然暗惊。<br /><br />
　　此神来之笔也！<br /><br />
