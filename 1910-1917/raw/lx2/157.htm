<td class="t50">卷九 四〇、得冬秀书</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月廿八日）<br /><br />
　　得冬秀一书，辞旨通畅，不知系渠自作，抑系他人所拟稿？书中言放足事已行之数年，此大可喜也。<br /><br />
　　渠母病甚，读之恻然。岳氏吾于甲辰春见之。岳氏为择婿故，来吾外祖家会吾母及余，同居数日始别，今十余年矣。岳氏今年五十有八，老病且死，而“向平”之愿未了，则余亦不得辞其咎耳。<br /><br />
