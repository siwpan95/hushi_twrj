<td class="t50">卷七 一九、《李鸿章自传》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月三十日）<br /><br />
　　哲学教师汉蒙先生今夜应哲学会之请，来会谈话，摘读美国新出版之《李鸿章自传》（Memoirs of Li 
Hung-Chang）。此书所记李氏日记，乃大不类中人口吻，疑出伪托也。他日当觅此书细研究之，如果出伪托，当揭其奸。（数日后，余借得此书读之，果皆伪作也。因作书评呈汉蒙先生，请其寄与印行此书之书店。）<br /><br />
