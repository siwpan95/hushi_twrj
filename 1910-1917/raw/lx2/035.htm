<tr><td>
<br />
　　（九月廿五日追记）<br /><br />
　　海外送归人图（图略），曾广智君摄。归者为黄伯芹君。伯芹为此间同学之佼佼者。其人有热诚，肯任事，而明达事理。所习为地学，去年得为Sigma 
Xi会会员。留学之广东学生每每自成一党，不与他处人来往，最是恶习，伯芹独不尔尔，故人多归之。<br /><br />
