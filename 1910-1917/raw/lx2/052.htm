<td class="t50">卷七 二〇、演说之道</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月三十日）<br /><br />
　　演说的规则：一、先要知道“演说术”（Oratory）已不合时宜了；二、先把你要说的话一一想好；三、把事实陈述完了，就坐下来；四、不要插入不相干的笑话；五、不要管手势、声音等等；六、个个字要清楚；七、演说之前不要吃太饱，最好喝杯茶，或小睡；八、小有成功，不可自满；当时时更求进步。<br /><br />
　　此一则见杂志，记演说之道，甚合吾平日所阅历，附记于此。<br /><br />
