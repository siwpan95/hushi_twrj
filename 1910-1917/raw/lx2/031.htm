<td class="t50">卷六 三二、朝鲜文字母</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月十五日）<br /><br />
　　<img alt="胡适留学日记" src="t04.jpg" width="566" height="308" /><br />
　　<img alt="胡适留学日记" src="t05.jpg" width="566" height="321" /><br /><br />
　　吾友韩人金铉九君言，“朝鲜本有此种文字，其原甚古，至汉文入，此语遂衰，至五百年前始有人恢复之，今普及全国，惟中上社会犹用汉文汉语耳。”此种字母源出何语耶？吾国古代未有象形文字之先曾有字母否？如有之，尚可考求否？如无之，则仓颉以前，吾国用何种语言耶？天皇作“干支”，其名皆似一种拼音之字，彼所用是何语耶？附干支之名：<br /><br />
　　<img alt="胡适留学日记" src="t07.png" width="566" height="363" /><br /><br />
　　此种名如何传至后世耶？记之者何所本耶？<br /><br />
