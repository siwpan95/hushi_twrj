<tr><td>
<br />
　　（八月十一日）<br /><br />
　　本校经济学教长蒋生先生（A. S. 
Johnson）前日在《纽约时报》作论，言欧洲战祸之影响，以为美国航海商业必将大受其利。惟无论如何全世界所受损失甚大，不易补救。美人虽暂得渔人之利，所得不偿全世界之失也。<br /><br />
