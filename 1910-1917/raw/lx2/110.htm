<hr />

<tr><td>
<br />
　　（二月九日）<br /><br />
　　前所记自哥伦布归时，火车中遇一人，赠余以所摄尼格拉飞瀑影片。今日得一函，启视之，则飞瀑冬景也。其诸图皆佳。吾与此君真萍水之交，乃蒙相念如此，可感也。<br /><br />
