<td class="t50">卷八 三、海外之家人骨肉</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月十四日）<br /><br />
　　得白特生夫人电话，邀星期四夜晚餐其家，以有他会辞之，乃改星期五夜。既而思之，星期四夜乃十二月十七日，为余生日，白特生夫人作此筵为余作生日耳。远客海外，久忘岁月，乃蒙友朋眷念及此，解我客思，慰我寂寥，此谊何可忘也。思及此，几为感激泪下。白特生夫妇视我真如家人骨肉，我亦以骨肉视之。<br /><br />
</td></tr>
