<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月十九日）<br /><br />
　　法文豪都德（Daudet）著书甚富，为近代文学巨子之一，其著短篇小说尤动人。余前年译其<i>La Dernère 
Class</i>，易名《割地》，登上海《大共和日报》。去年八月，德军长驱入法境，巴黎有被围之虞，因译其<i>Le Siège de 
Berlin</i>（《柏林之围》），登第四号《甲寅》。都德之出现于汉文，实余为之先容也。偶语此间法文教师Guerlac先生及此节，先生大喜，因索译稿一份，言将寄与都德之孀Madame 
Daudet。<br /><br />
