<td class="t50">卷七 一八、周诒春君过美之演说</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月三十日）<br /><br />
　　清华学堂校长周诒春君过此，此间同学开会欢迎之。周君演说，略曰：“诸君毕业，可归即亟归，勿久留此，须知中国需才急也。”此言乃与余平日所持“毋欲速”，宜久留习高等学问，学不厌深之意均反。周君又言留美归国学生之大病：“一曰自高声价”，是也；“二曰不切实用”（Fall 
short of real practicality）。其所举不切实用之例，如“不知运动场规则，不知踢球场广袤，不知议事秩序”，似近于细碎。<br /><br />
