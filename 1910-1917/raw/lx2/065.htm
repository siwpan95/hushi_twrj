<tr><td>
<br />
　　（十一月十一日）<br /><br />
　　青岛于四日前（七日）降日。青岛一破，东亚兵祸不日可息矣。惟日人已占胶济铁路全线，上日竟占济南。拒虎而进狼，山东问题殊不易解决也。<br /><br />
