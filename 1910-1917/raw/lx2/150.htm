<td class="t50">卷九 三三、《致留学界公函》发表后之反响</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月廿五日）<br /><br />
　　吾所作《致留学界公函》（见本卷第二四则）登出后，大受流辈攻击：邝煦堃君（《月报》主笔）诋为“木石心肠，不爱国”。谌湛溪（立，《战报》主笔）来书云：“大著结论，盘马弯弓故不发，将军之巧，不过中日合并耳。足下果敢倡此论乎？东亚大帝国之侯封可羡，目前爱国者之暴行又可畏，作个半推半就，毕竟也无甚大不妥。”又王君复亦致书相诋，其书由叔永转致，叔永至毁弃其书，不欲转致，其词意之难堪可想。叔永忠厚可感也。<br /><br />
</td></tr>
