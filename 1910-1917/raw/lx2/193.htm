<td class="t50">卷九 七六、刘过词不拘音韵</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月六日）<br /><br />
　　又读刘过（改之）《龙洲词》，有《六州歌头》二阕，其词不佳，而用韵甚可玩味。所用韵为：<br /><br />
　　英　膺　生　庭　烹　民　倾　真<br /><br />
　　临　心　臣　明　恩　春　神<br /><br />
　　盖不独以庚、青、蒸通真、元、文，且收入侵韵。此可见音韵之变迁，宋时已然；又可见南渡诸词人之豪气橫纵，不拘拘于音韵之微也。<br /><br />
