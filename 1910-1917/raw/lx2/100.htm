<td class="t50">卷八 一五、为学要能广大又能高深</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月三日）<br /><br />
　　学问之道两面（面者，算学之dimension）而已：一曰广大（博），一曰高深（精），两者须相辅而行。务精者每失之隘，务博者每失之浅，其失一也。余失之浅者也。不可不以高深矫正之。<br /><br />
