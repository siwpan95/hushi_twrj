<td class="t50">卷九 四八、韦女士</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（五月八日）<br /><br />
　　女士最洒落不羁，不屑事服饰之细。欧美妇女风尚（Fashion），日新而月异，争奇斗巧，莫知所届。女士所服，数年不易。其草冠敝损，戴之如故。又以发长，修饰不易，尽剪去之，蓬首一二年矣。行道中，每为行人指目，其母屡以为言。女士曰：“彼道上之妇女日易其冠服，穷极怪异，不自以为怪异，人亦不之怪异，而独异我之不易，何哉？彼诚不自知其多变，而徒怪吾之不变耳。”女士胸襟于此可见。<br /><br />
