<td class="t50">卷十六 一二、作《论九流出于王官说之谬》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月十六日）<br /><br />
　　作《论九流出于王官说之谬》成，凡四千字：<br /><br />
　　（一）刘歆以前无此说也。<br /><br />
　　（二）九流无出于王官之理也。<br /><br />
　　（三）《七略》所立九流之目皆无征，不足依据。<br /><br />
　　（四）章太炎之说亦不能成立。<br /><br />
　　（1）其所称证据皆不能成立。<br /><br />
　　（2）古者学在官府之说，不足证诸子之出于王官。<br /><br />
　　（五）结论。<br /><br />
　　此文寄与秋桐。<br /><br />
