<td class="t50">卷十五 一六、古文家治经不足取</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月廿六日）<br /><br />
　　顷得吴挚甫《点勘墨子读本》，读之终卷，仅得可采者一二事耳。古文家治经治古籍最不足取，以其空疏也。如《经说上》：“凡牛枢非牛”，下注云：“枢者，区之借字，《华严经音义》引《论语》马注：‘区，别也。’”桐城先生岂并《十三经注疏》亦未之见耶？若然，则古文家读书之少真可令人骇怪矣。（“区，别也”，乃《论语》“区以别矣”句之马融注，见何晏《集解》，今在《十三经注疏》之中）<br /><br />
　　〔又按〕<br /><br />
　　此说未免轻易冤枉人。适又记。<br /><br />
