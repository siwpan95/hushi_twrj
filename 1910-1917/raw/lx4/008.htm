<tr><td>

　　Expression is the best means of appropriating an 
impression.（你若想把平时所得的印象感想变成你自己的，只有表现是最好的方法。）此吾自作格言。如作笔记，作论文，演说，讨论，皆是表现。平日所吸收之印象皆模糊不分明；一经记述，自清楚分明了。<br /><br />
