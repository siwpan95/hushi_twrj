<td class="t50">卷十五 一三、月诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月六日）<br /><br />
　　一<br /><br />
　　明月照我床，卧看不肯睡。窗上青藤影，随风舞娟媚。<br /><br />
　　二<br /><br />
　　我但玩明月，更不想什么。月可使人愁，定不能愁我。<br /><br />
　　三<br /><br />
　　月冷寒江静，心头百念消。欲眠君照我，无梦到明朝。<br /><br />
　　数月以来，叔永有《月诗》四章，词一首，杏佛有《寻月诗》《月诉词》，皆抒意言情之作。其词皆有愁思，故吾诗云云。<br /><br />
