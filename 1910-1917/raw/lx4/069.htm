<td class="t50">卷十六 一五、清庙之守</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月二十日）<br /><br />
　　《艺文志》言墨家盖出于清庙之守，吾已言其谬矣。今念清庙究是何官，此说汉儒无人能言之。《诗·清庙》郑笺云：“清庙者，祭有清明之德者之宫也。谓祭文王也。天德清明，文王象焉，故祭之而歌此诗也。”《正义》引贾逵《左传》注云，“肃然清静，谓之清庙。”<br /><br />
　　夫汉儒不能明知清庙为何物，乃谓清庙之官为墨家所自出，不亦诬乎？<br /><br />
