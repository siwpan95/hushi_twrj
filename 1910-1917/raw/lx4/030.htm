<td class="t50">卷十五 三〇、在斐城演说</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　斐城之演说乃Haverford College Alumni 
Association（哈佛学院女校友协会）之“年宴”所招。此校新校长为前在康乃耳之康福先生（William W. 
Comfort）。此次年宴席后演说者本为美国前总统塔虎脱氏，及康乃耳大学校长休曼氏。休曼校长辞不能来，康福先生荐适代之。适以其为异常优宠，却之不恭，故往赴之。此次所说为“美国能如何协助中国之发达”，稿另有刊本。塔总统所说为“维持和平同盟会”。<br /><br />
