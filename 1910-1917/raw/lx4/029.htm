<td class="t50">卷十五 二九、中国十年后要有什么思想</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　一月廿七日至斐城（Philadelpha）演说。斐城在纽约与华盛顿之间，已行半途，不容不一访经农。故南下至华盛顿小住，与经农相见甚欢。一夜经农曰：<br /><br />
　　我们预备要中国人十年后有什么思想？<br /><br />
　　此一问题最为重要，非一人所能解决也，然吾辈人人心中当刻刻存此思想耳。<br /><br />
