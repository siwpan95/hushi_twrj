<td class="t50">卷十五 四九、艳歌三章</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月六日）<br /><br />
　　《墨经》云：“景不徙，说在改为。”《经说》云：“景，光至景亡；若在，尽古息。”《列子》公子牟云：“景不徙，说在改也。”《庄子·天下篇》曰：“飞鸟之影未尝动也。”今用其意，作诗三章。<br /><br />
　　飞鸟过江来，投影在江水。鸟逝水长流，此影何曾徙？<br /><br />
　　风过镜平湖，湖面生轻绉。湖更镜平时，此绉终如旧。<br /><br />
　　为他起一念，十年终不改。有召即重来，若忘而实在。<br /><br />
