<td class="t50">卷十六 七、几部论汉学方法的书</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　论汉学方法之书，最要者莫如下列诸籍：<br /><br />
　　（一）段玉裁　《与诸同志论校书之难》书。（《经韵楼集》）<br /><br />
　　（二）王引之　《经义述闻》卷廿九——三十，《通说》上下。<br /><br />
　　（三）王引之　《经传释词》。<br /><br />
　　（四）阎若璩 《古文尚书疏证》。（一百廿八卷）<br /><br />
　　惠　栋 《古文尚书考》。（二卷）<br /><br />
　　（五）俞　樾 《古书疑义举例》。<br /><br />
　　（六）章炳麟 《国故论衡》。<br /><br />
