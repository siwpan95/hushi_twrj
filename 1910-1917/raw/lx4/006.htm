<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　美国《世纪》杂志编辑人吉尔得（Richar Watson 
Gilder）死后，其“书札”近始出版，纽约《晚邮报》评论此书，并论其人，谓此君阅读外来投稿，最留心人才，对于作家最富于同情心；彼自言作编辑人须有三德：一须有思想，二须有良心，三须有良好的风味（good 
taste），彼实能兼有之。<br /><br />
