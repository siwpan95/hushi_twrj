<td class="t50">卷十五 五、黄克强将军哀辞</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月九日）<br /><br />
　　黄克强（兴）将军前日逝世，叔永有诗挽之。余亦有作。<br /><br />
　　当年曾见将军之家书，<br /><br />
　　字迹飞动似大苏。<br /><br />
　　书中之言竟何如？<br /><br />
　　“一欧吾儿，努力杀贼”：——<br /><br />
　　八个大字，<br /><br />
　　读之使人感慨奋发而爱国。<br /><br />
　　呜呼将军，何可多得！<br /><br />
</td></tr>
