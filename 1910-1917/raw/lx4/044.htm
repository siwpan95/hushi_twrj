<td class="t50">卷十五 四四、记灯谜</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月廿三日）<br /><br />
　　俞樾全集中有《隐书》一卷，皆谜也。中有多则，久流传人间。然殊多中下之作。有《祀典》一谜，射“祭遵”，吾读之，因作一谜云：<br /><br />
　　弟为尸　　射　　祭仲<br /><br />
　　吾又有一则云：<br /><br />
　　多中本有一，去了这个一，换上一个壹，请问是何物？射　Money<br /><br />
　　陈女士有一谜云：<br /><br />
　　t（英文字母）　射　“宛在水中央”<br /><br />
