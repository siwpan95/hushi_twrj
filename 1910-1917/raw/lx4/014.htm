<td class="t50">卷十五 一四、打油诗答叔永</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十二月廿日）<br /><br />
　　昨得叔永一诗，言欲以一诗题吾白话之集。其诗云：<br /><br />
　　文章革命标题大，<br />
　　白话工夫试验精。<br />
　　一集打油诗百首，<br />
　　“先生”合受“榨机”名。（“榨机”两字陈女士初用之。）<br /><br />
　　吾亦报以诗曰：<br /><br />
　　人人都做打油诗（朱、任、杨、陈皆为之。），<br />
　　这个功须让“榨机”。<br />
　　欲把定盦诗奉报：<br />
　　“但开风气不为师。”<br /><br />
