<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月十一日追记）<br /><br />
　　此次节假，觐庄与擘黄皆来游纽约。吾与觐庄日日辩论文学改良问题。觐庄别后似仍不曾有何进益，其固执守旧之态仍不稍改。夫友朋讨论，本期收观摩之益也。若固执而不肯细察他人之观点，则又何必辩也？<br /><br />
