<hr />
</td></tr>
<tr><td>
<br />
　　自美京归时，作一诗寄经农、文伯（文伯，吉林王征字）。<br /><br />
　　日斜橡叶非常艳，雪后松林格外青。<br /><br />
　　可惜京城诸好友，不能同我此时情。<br /><br />
