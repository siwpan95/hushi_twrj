<tr><td>
<br />
　　（五月十九日）<br /><br />
　　吾友根内特君（Lewis 
S.Gaunett）以电话告我，言将归与洛斯女士（Ross）结婚。吾因招之晚餐。餐后与之同往纽约《世界报》一游（根君与洛女士皆此报中访事）。此报社自晨至晚出报七八次。社中自主笔以下至告白房及印刷所工人，凡用人二千二百人，可谓盛矣。惜夜间匆匆不能详观其中一切组织而为之记耳。（参看卷十四第一二则）<br /><br />
