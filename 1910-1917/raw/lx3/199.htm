<td class="t50">卷十四 三五、《虞美人》戏朱经农</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月十二日）<br /><br />
　　经农寄二词，其序曰：“昨接家书，语短而意长；虽有白字，颇极缠绵之致。……”其词又有“传笺寄语，莫说归期误”之句，因作一词戏之。（此为吾所作白话词之第一首）<br /><br />
　　先生几日魂颠倒，他的书来了！虽然纸短却情长，带上两三白字又何妨？<br /><br />
　　可怜一对痴儿女，不惯分离苦；别来还没几多时，早已书来细问几时归。<br /><br />
