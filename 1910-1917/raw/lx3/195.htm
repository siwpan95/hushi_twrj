<td class="t50">卷十四 三一、他</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月六日）<br /><br />
　　日来东方消息不佳。昨夜偶一筹思，几不能睡。梦中亦仿佛在看报找东方消息也。今晨作此自调。<br /><br />
　　你心里爱他，莫说不爱他。<br />
　　要看你爱他，且等人害他。<br />
　　倘有人害他，你如何对他？<br />
　　倘有人爱他，更如何待他？（待字今音大概皆读去声。）<br /><br />
　　〔注〕<br /><br />
　　或问忧国何须自解，更何消自调。答曰：因我自命为“世界公民”，不持狭义的国家主义，尤不屑为感情的“爱国者”故。<br /><br />
