<td class="t50">卷十四 一三、宋人白话诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月廿一日）<br /><br />
　　东坡在凤翔，见壁上有诗云（惠洪《冷斋夜话》一）：<br /><br />
　　人间无漏仙，兀兀三杯醉。世上没眼禅，昏昏一觉睡。<br /><br />
　　虽然没交涉，其奈略相似。相似尚如此，何况真个是？<br /><br />
　　此亦白话诗也。<br /><br />
