<td class="t50">卷十二 三七、忆绮色佳</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月五日）<br /><br />
　　前月有《忆绮色佳》一绝，以其不佳，故不留稿。今记叔永“更作飞泉声，入君梦里吼”之句，复忆前诗，因写于此，以存一时鸿爪云尔。<br /><br />
　　别后湖山无恙否？几番游子梦中回。<br /><br />
　　街心车作雷声过，也化惊湍入梦来。<br /><br />
