<td class="t50">卷十一 三九、调和之害</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月一日）<br /><br />
　　与人言调和之害。调和者，苟且迁就之谓也。张亦农言：“凡人之情，自趋于迁就折衷一方面。有非常之人出，而后敢独立直行，无所低徊瞻顾。如此，犹恐不能胜人性迁就苟且之趋势。若吾辈自命狂狷者亦随波逐流，则天下事安可为耶？”此言甚痛，为吾所欲言而不能言，故追记之。<br /><br />
