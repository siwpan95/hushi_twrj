<td class="t50">卷十二 四三、《沁园春》誓诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月十三日初稿）<br /><br />
　　昨日读书不乐，因作一词自遣。<br /><br />
　　沁园春<br /><br />
　　更不伤春，更不悲秋，以此誓诗。任花开也好，花飞也好，月圆固好，日落何悲？我闻之曰，“从天而颂，孰与制天而用之”？更安用为苍天歌哭，作彼奴为！<br /><br />
　　文章革命何疑！且准备搴旗作健儿。要前空千古，下开百世，收他臭腐，还我神奇。为大中华，造新文学，此业吾曹欲让谁？诗材料，有簇新世界，供我驱驰。<br /><br />
</td></tr>
