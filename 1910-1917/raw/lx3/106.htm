<td class="t50">卷十二 二五、叔永答余论改良文学书</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（二月十日）<br /><br />
　　……要之，无论诗文，皆当有质。有文无质，则成吾国近世委靡腐朽之文学，吾人正当廓而清之。然使以文学革命自命者，乃言之无文，欲其行远，得乎？近来颇思吾国文学不振，其最大原因乃在文人无学。救之之法，当从绩学入手，徒于文字形式上讨论，无当也。……<br /><br />
