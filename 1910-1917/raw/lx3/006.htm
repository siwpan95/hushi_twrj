<td class="t50">卷十 六、记农家夏季“辟克匿克”</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月一日追记）<br /><br />
　　一日，附近之节克生村有一县农家夏季“辟克匿克”，农院教师脱克先生（Charles H. 
Tuck）招余同往观焉。至则老幼佥在，男妇杂坐。农院教师数人为诸农讲畜蛋法及养马法。日午而餐，则前农院院长裴立先生亦挈其女至。餐已少休。下午在草地上开会，裴立先生演说，余亦致短词为颂。此等会集，亦采风觇国者所不可不见也。<br /><br />
