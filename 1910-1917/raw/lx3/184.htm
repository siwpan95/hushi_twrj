<td class="t50">卷十四 二〇、答江亢虎</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月卅日）<br /><br />
　　……今日思想闭塞，非有“洪水猛兽”之言，不能收振聩发聋之功。今日大患，正在士君子之人云亦云，不敢为“洪水猛兽”耳。适于足下所主张，自视不无扞格不入之处，然于足下以“洪水猛兽”自豪之雄心，则心悦诚服，毫无间言也。……<br /><br />
　　江君提倡社会主义，满清时，增韫以“祸甚于洪水猛兽”电奏清廷。君闻之忻然，且名其集曰“洪水集”。故吾书及之。<br /><br />
