<td class="t50">卷十二 二、杨杏佛《遣兴》诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月廿五日）<br /><br />
　　《季报》第二年一号有杏佛《遣兴》诗：<br /><br />
　　黄叶舞秋风，白云自西去。落叶归深涧，云倦之何处？<br /><br />
　　（适以为末二句如改“落叶下深涧，云倦归何处？”当更佳。）<br /><br />
　　余极喜之，以为杏佛年来所作诗，当以此二十字为最佳。<br /><br />
