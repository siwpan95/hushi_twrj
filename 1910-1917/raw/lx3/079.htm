<td class="t50">卷十一 五〇、女子教育之最上目的</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月卅日）<br /><br />
　　吾自识吾友韦女士以来，生平对于女子之见解为之大变，对于男女交际之关系亦为之大变。女子教育，吾向所深信者也。惟昔所注意，乃在为国人造良妻贤母以为家庭教育之预备，今始知女子教育之最上目的乃在造成一种能自由能独立之女子。国有能自由独立之女子，然后可以增进其国人之道德，高尚其人格。盖女子有一种感化力，善用之可以振衰起懦，可以化民成俗，爱国者不可不知所以保存发扬之，不可不知所以因势利用之。<br /><br />
</td></tr>
