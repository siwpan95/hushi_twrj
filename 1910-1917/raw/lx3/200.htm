<td class="t50">卷十四 三六、研（读《易》四）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月十四日）<br /><br />
　　《说文》：“研，&#16634;也。&#16634;，石硙也（今省作磨）。”又“碎，&#16634;也（段作&#17075;）。砻，&#16634;也（今谓磨谷取米曰砻）。”研字本谓磨而碎之之意。故《易》有“夫易，圣人之所以极深而研几也。”又曰：“能说诸心，能研诸虑。”研，犹今言“细细分析”也。译成英文，当作Analysis。今人言“研究”，本谓分析而细观之。古人如老、孔，皆以“天下大事必作于细”，故其论断事理，先须磨而碎之，使易于观察，故曰研也。<br /><br />
