　　（九月一日）<br /><br />
　　曰：“仁矣乎？”曰：“未知焉得仁。”（《公冶长》）<br /><br />
　　旧皆读“未知。焉得仁？”<br /><br />
　　〔适按〕<br /><br />
　　此五字宜作一句读，谓“不知如何可称他做仁”也。<br /><br />
