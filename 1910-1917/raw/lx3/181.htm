<td class="t50">卷十四 一七、打油诗戏柬经农、杏拂</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月二十二日）<br /><br />
　　老朱寄一诗，自称“仿适之”。老杨寄一诗，自称“白话诗”。<br /><br />
　　请问朱与杨，什么叫白话？货色不道地，招牌莫乱挂。<br /><br />
　　〔注〕<br /><br />
　　杏佛送叔永诗有“疮痍满河山，逸乐亦酸楚”。“畏友兼良师，照我暗室烛。三年异邦亲，此乐不可复”之句，皆好。自跋云：“此铨之白话诗也。”经农和此诗寄叔永及余，有“征鸿金锁绾两翼；不飞不鸣气沈郁”之句。自跋云：“无律无韵，直类白话，盖欲仿尊格，画虎不成也。”<br /><br />
