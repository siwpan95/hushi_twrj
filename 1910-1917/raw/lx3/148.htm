　　（六月十六日追记）<br /><br />
　　图乃杜威先生及安庆胡天濬君合影，陶知行（文濬）所摄。（图略）<br /><br />
　　杜威（John Dewey）为今日美洲第一哲学家，其学说之影响及于全国之教育心理美术诸方面者甚大，今为哥伦比亚大学哲学部长，胡陶二君及余皆受学焉。<br /><br />
