<td class="t50">卷十三 七、古代文明易于毁灭之原因</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月三十日）<br /><br />
　　古代文明所以有毁灭之虞者，以其影响所被之疆域甚小，故一遭摧折，即绝灭无存。其有存者，幸也。今日之文明，则除地球毁灭外更无此虞矣。古代克里特（Crete，地中海东部一岛国）之文明至今始有人发现之。希腊之科学，吾国古代之科学，今皆成绝学，亦以此也。<br /><br />
　　偶与友人弗李格曼女士（F. Fliegelman）谈及此，遂志之。弗女士治社会学，人类学甚精。<br /><br />
