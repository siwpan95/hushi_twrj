<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（七月廿九日）<br /><br />
　　中　庸<br /><br />
　　“取法乎中还变下，取法乎上或得中。”<br /><br />
　　孔子晚年似解此，欲从狂狷到中庸。<br /><br />
　　孔　丘<br /><br />
　　“知其不可而变之，亦不知老之将至”。<br /><br />
　　认得这个真孔丘，一部论语都可废。<br /><br />
