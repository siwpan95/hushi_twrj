<td class="t50">卷十一 一八、《水调歌头》杏佛赠别</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月廿八日）<br /><br />
　　杏佛赠一词为别：<br /><br />
　　水调歌头<br /><br />
　　杨杏佛<br /><br />
　　三稔不相见，一笑遇他乡。暗惊狂奴非故，收束入名场。秋水当年神骨，古柏而今气概，华贵亦苍凉。海鹤入清冥，前路正无疆。<br /><br />
　　羡君健，嗟我拙，更颓唐。名山事业无分，吾志在工商。不羡大王（指托那司）声势，欲共斯民温饱，此愿几时偿？各有千秋业，分道共翱翔。<br /><br />
</td></tr>
