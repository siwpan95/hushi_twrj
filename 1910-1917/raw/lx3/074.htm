<td class="t50">卷十一 四五、叶书山论《中庸》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　《两般秋雨盦随笔》云：“叶书山庶子谓《中庸》非子思所作。其说云，伪托之书，罅隙有无心而发露者。孔孟皆山东人，论事俱就眼前指点。孔子曰：‘曾谓泰山！’又曰：‘泰山其颓！’孟子曰：‘挟泰山。’又曰：‘登泰山’……就所居之地指所有之山，人之情也。汉都长安，华山在焉。《中庸》引称华山，明明以长安之人指长安之山。”<br /><br />
</td></tr>
