<td class="t50">卷十二 三二、往访泽田吾一</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（三月廿六日）<br /><br />
　　夜访泽田吾一君于其室，谈甚欢。君嘱余写一诗示之，因书七年前旧作《秋柳》一绝与之。其诗曰：<br /><br />
　　但见萧飕万木摧，尚馀垂柳拂人来。<br /><br />
　　词人漫说柔条弱，也向西风舞一回。<br /><br />
　　泽田君言日本有谚语云：<br /><br />
　　柳丿枝雪二折无氵。（雪压不断杨柳条）<br /><br />
　　与吾诗意正同。余大喜，因记之。<br /><br />
