<td class="t50">卷十 二、读《猎人》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月十五日）<br /><br />
　　吾友W. F. Edgerton称Olive Schreiner之寓言小说《猎人》（<i>The 
Hunter</i>）之佳，因读之，殊不恶。其命意与邓耐生之<i>Ulysses</i>，及卜郎吟之<i>A Grammarian's Funeral</i>同而不及二诗之佳也。<br /><br />
　　所述二诗，皆“发愤求学，不知老之将至”之意，皆足代表十九世纪探赜索隐百折不挠之精神，令人百读不厌。<br /><br />
</td></tr>
