<td class="t50">卷十四 四二、白话律诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月十五日）<br /><br />
　　昨日戏以白话作律诗，但任、朱诸人定不认此为白话诗耳。<br /><br />
　　江上秋晨<br /><br />
　　眼前风景好，何必梦江南？云影渡山黑，江波破水蓝。<br /><br />
　　渐多黄叶下，颇怪白鸥贪。小小秋蝴蝶，随风来两三。<br /><br />
　　古人皆言鸥闲。以吾所见，则鸥终日回旋水上捉鱼为食，其忙可怜，何闲之有乎？<br /><br />
