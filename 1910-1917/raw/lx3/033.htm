<td class="t50">卷十一 四、“时”与“间”有别</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月十五日）<br /><br />
　　余尝以为Time当译为“时”，Space当译为“间”。《墨子·经上》云：“有间，中也。间，不及旁也。”今人以时间两字合用，非也。顷读蔡孑民先生旧译《哲学要领》，以“宇”译Space，以“宙”译Time，又曰：空间及时间。此亦有理。按《淮南子·齐俗训》云：“往古来今谓之宙，四方上下谓之宇”，则宇宙古有“间”与“时”之别也。<br /><br />
</td></tr>
