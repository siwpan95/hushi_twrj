<td class="t50">卷十四 二七、读《易》（一）</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月三日）<br /><br />
　　“几者，动之微，吉之先见者也。”《正义》曰：“诸本或有‘凶’字者，其定本则无也。”<br /><br />
　　〔适按〕<br /><br />
　　吉下有“凶”字者，是也。此处阮元《校勘记》无一语。盖唐人所谓“定本”，已无此字。阮元所见诸本，以唐《石经》为最古，其他诸本更不及见有“凶”字之本矣。<br /><br />
