<td class="t50">卷十一 四〇、相思</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十月十三日）<br /><br />
　　自我与子别，于今十日耳。奈何十日间，两夜梦及子？<br /><br />
　　前夜梦书来，谓无再见时。老母日就衰，未可远别离。<br /><br />
　　昨梦君归来，欢喜便同坐。语我故乡事，故人颇思我。<br /><br />
　　吾乃澹荡人，未知“爱”何似。古人说“相思”，毋乃颇类此？<br /><br />
