<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月四日）<br /><br />
　　There are those who are destined to become leaders of men. They think hard and 
work hard: that is the secret of leadership.<br /><br />
　　—<i>Loy Chang</i><br /><br />
　　〔中译〕<br /><br />
　　有些人命中注定要成领袖。他们勤于思考，努力工作：此乃领导之秘诀所在。<br /><br />
　　——郑莱<br /><br />
