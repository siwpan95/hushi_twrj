<td class="t50">卷十四 一八、窗上有所见口占</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月廿三日）<br /><br />
　　两个黄蝴蝶，双双飞上天。不知为什么，一个忽飞还。<br /><br />
　　剩下那一个，孤单怪可怜；也无心上天，天上太孤单。<br /><br />
　　〔自跋〕<br /><br />
　　这首诗可算得一种有成效的实地试验。<br /><br />
