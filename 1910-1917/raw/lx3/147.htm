<td class="t50">卷十三 一七、喜朱经农来美</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月九日）<br /><br />
　　朱经农新自国中来，居美京，为教育部学生监督处书记，将以馀力肄业于华盛顿大学。<br /><br />
　　经农为中国公学之秀，与余甚相得，余庚戌《怀人诗》所谓“海上朱家”者是也。革命后，国中友人，音问多疏，独时时念及汤保民及经农二人。今闻其来，喜何可言？惜不能即相见耳。<br /><br />
