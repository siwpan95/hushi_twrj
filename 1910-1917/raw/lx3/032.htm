<tr><td>
<br />
　　（八月十三日）<br /><br />
　　月来得嗽病，疑是肺病，往乞吾友雷以特医士（Dr. F. R. 
Wright）诊之。君为我细细察视，以为非肺病，惟言余每日须睡九时，步行（疾行）一时。此大非易事，当勉强为之。<br /><br />
