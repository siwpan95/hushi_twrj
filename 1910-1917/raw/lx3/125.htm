<tr><td class="jz">

<tr><td>
<br />
　　（四月十三日）<br /><br />
　　昨日怡荪寄赠所手抄之俞樾《读公孙龙子》一册，读之甚快。<br /><br />
　　友朋知余治诸子学，在海外得书甚不易，故多为余求书。去年近仁为余手写吴草卢《老子注》全书，今怡荪复为写此书，故人厚我无，可感念也。<br /><br />
