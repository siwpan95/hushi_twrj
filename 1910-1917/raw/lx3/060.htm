<td class="t50">卷十一 三一、“八角五分”桑福</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月八日）<br /><br />
　　下图为桑福君（Raymond P. 
Sanford），亦苦学生之一也。其人贫甚而多能，精食料之学（Dietetics），自配制食物饮料，期于养身而价贱，久之竟能以八角五分金支七日之食。好事者争传其事，遂遍国中，今相识尚称之为“八角五分桑福”。<br /><br />
　　君昨遇余于道上，欲摄余影。余笑拒之，以为衣服不整，不当入画，语未终而影已成，即上图也。（图删）<br /><br />
