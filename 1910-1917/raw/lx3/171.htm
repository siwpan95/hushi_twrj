<td class="t50">卷十四 七、死语与活语举例</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（八月四日）<br /><br />
　　吾所谓活字与死字之别，可以一语为例。《书》曰：“惠迪吉，从逆凶。”“从逆凶”是活语，“惠迪吉”是死语。此但谓作文可用之活语耳。若以吾“听得懂”之律施之，则“从逆凶”亦但可为半活之语耳。<br /><br />
</td></tr>
