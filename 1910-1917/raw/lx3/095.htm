<td class="t50">卷十二 一四、七绝之平仄</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（一月廿六日）<br /><br />
　　凡七言绝句之<img alt="胡适留学日记" src="t33.png" width="172" height="37" />之句，第三字皆当用平声。必不得已而用仄，则第五字当用平。例如：<br /><br />
　　笑问<img alt="胡适留学日记" src="t34.png" width="33" height="34" />从<img alt="胡适留学日记" src="t35.png" width="32" height="33" />处来<br /><br />
　　忽见<img alt="胡适留学日记" src="t36.png" width="32" height="33" />头<img alt="胡适留学日记" src="t37.png" width="31" height="33" />柳色<br /><br />
　　日暮<img alt="胡适留学日记" src="t38.png" width="31" height="33" />宫<img alt="胡适留学日记" src="t39.png" width="32" height="33" />蜡烛<br /><br />
　　又凡七言绝句，每句之第三字皆以平声为佳；无论其为<img alt="胡适留学日记" src="t40.png" width="174" height="22" />或为<img alt="胡适留学日记" src="t41.png" width="173" height="24" />也。试检《唐诗三百首》中之七绝五十余首，共二百余句，其第三字用仄者不过二十余句。如：<br /><br />
　　梨花<img alt="胡适留学日记" src="t42.png" width="32" height="33" />地不开门（第六字平，故第五字不妨仄也。）<br /><br />
　　葡萄<img alt="胡适留学日记" src="t43.png" width="32" height="33" />酒夜光杯<br /><br />
　　此二十余句之中，十之八皆<img alt="胡适留学日记" src="t44.png" width="175" height="23" />之句也。<br /><br />
