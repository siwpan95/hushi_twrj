<td class="t50">卷十二 三六、叔永诗</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（四月五日追记）<br /><br />
　　叔永寄二诗：<br /><br />
　　送　雪<br /><br />
　　长冬冱穷阴，数月雪封地。赠我粉本图，谢君琼瑶意。<br /><br />
　　几日春风回，送汝将远逝。（原文五六句与三四句互易）<br /><br />
　　雪　答<br /><br />
　　今年与君居【原注：原文居作期。&quot;/&gt;<br /><br />
　　，不谓时当久。修短共乘化，别离亦何有。<br /><br />
　　更作飞泉声，入君梦里吼。<br /><br />
　　适去绮色佳时赠叔永诗有“此邦邮传疾无比，月月诗筒未应绝”之句。别后叔永寄诗无数，而适来此后作诗甚少，视叔永有愧色矣。<br /><br />
