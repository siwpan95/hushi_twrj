<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（九月三日）<br /><br />
　　早起忽大叫，奇景在眼前。天与水争艳，居然水胜天。<br /><br />
　　水色本已碧，更映天蓝色：能受人所长，所以青无敌。<br /><br />
