<td class="t50">卷十 一、满庭芳</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（六月十二日）<br /><br />
　　枫翼敲帘，揄钱入户，柳棉飞上春衣。落花时节，随地乱莺啼。枝上红襟软语（红襟，鸟名——Redbreast），商量定，掠地双飞（史梅溪有“又软语商量不定”句，甚喜之，今反其意而用之）。何须待，销魂杜宇，劝我不如归？（此邦无杜宇）<br /><br />
　　归期，今倦数。十年作客，已惯天涯。况壑深多瀑，湖丽如斯。多谢殷勤我友，能容我傲骨狂思。频相见，微风晚日，指点过湖堤。<br /><br />
　　久未作词，偶成此阕。去国后倚声，此为第三次耳。疏涩之咎，未始不坐此。<br /><br />
