<td class="t50">卷十四 四五、读《论语》</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　（十一月一日）<br /><br />
　　子曰：“君子耻其言而过其行。”（《宪问》）<br /><br />
　　阮元《校勘记》曰：<br /><br />
　　皇本，高丽本，“而”作“之”，“行”下有“也”字。按《潜夫论·交际篇》，“孔子疾夫言之过其行者”，亦作“之”字。<br /><br />
　　阮校是也，“而”当作“之”。朱子曰：<br /><br />
　　耻者，不敢尽之意；过者，欲有馀之辞。<br /><br />
　　此曲为之说耳。<br /><br />
