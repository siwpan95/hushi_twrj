<td class="t50">卷十一 四七、读The Spirit of Japanese Poetry</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　日人野口米次郎著<i>The Spirit of Japanese Poetry</i>（《日本诗歌的精神》）——<i>Yone Nogouchi</i>，吾友韦女士读而喜之，以假余。此君工英文，其书文笔雅洁畅适，极可诵。然似太夸，读之令人不快。<br /><br />
