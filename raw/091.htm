<td class="t50">1951年4月15日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　偶想“行一不义，杀一不辜，而得天下，皆不为也”，出于《孟子》何篇，因遍检之，第二遍才检得，在《孟子》三，《公孙丑》上。<br /><br />
　　原文是问伯夷、伊尹、孔子“有同欤”，孟子说：<br /><br />
　　有。得百里之地而君之，皆能以朝诸侯，有天下。行一不义，杀一不辜，而得天下，皆不为也，是则同。<br /><br />
　　年老了，记忆力差多了！<br /><br />
