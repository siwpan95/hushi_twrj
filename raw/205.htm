<td class="t50">1953年1月22日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　上午见客。<br /><br />
　　中午董大使约了一些新闻记者午餐。<br /><br />
　　下午写了几张字，收拾行李。<br /><br />
　　晚上张子良与司徒德约了美国心理作战处处长C·汉森与处中主要人员，凡廿六人，及其眷属，在张家吃饭。他们要我说话，我说了半点钟的话，又答复问话，约半点钟。<br /><br />
　　上飞机，十点半起飞，有董大使夫妇及友人多人来送别。<br /><br />
