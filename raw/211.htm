<td class="t50">1953年4月21日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　早九点半从夏洛茨维尔起程。午后到华盛顿。宗武夫妇、萧信如夫妇都来接，同去吃饭。<br /><br />
　　饭后我去看休默博士，他对于我的说帖，没有改动。我就寄出给雷蒙德·T·莫耶先生了。与吴光清兄谈。<br /><br />
　　下午七点，我搭火车回来。七点是慢车，共停十三处！<br /><br />
