<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　走到列克星顿大街（857）的模范书店，店主人马克斯·费尔伯独坐，我同他谈了一会儿，买了一大堆新旧书。<br /><br />
　　他的书目上有福克译的《论衡》，我问他时，已被别人买去了。<br /><br />
