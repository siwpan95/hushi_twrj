<tr><td>
<br />
　　驻美大使馆转胡适之先生：<br /><br />
　　台湾大学校长，业经俭日（二十八日）行政院第一七四次会议通过，任命钱思亮继任。是项任命发表，各方咸庆得人。弟特就此事发表谈话，本省各大日报均著论赞扬。知注特闻。<br /><br />
　　弟 陈诚 寅冬（三月二日）印<br /><br />
