<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　前引富尔顿·小刘易斯的，美国军队分驻在四十九国，（Aug·5）。<br /><br />
　　今天《纽约时报》有一图表，分析如下：<br /><br />
　　美国兵力 3，500，000<br /><br />
　　驻国内 2，400，000<br /><br />
　　国外 1，100，000<br /><br />
　　其重要地域如下：<br /><br />
　　<img src="t10.jpg" width="428" height="287" /><br /><br />
　　刘易斯所说四十九国当是包括一切的基地及军事代表团的国家。<br /><br />
