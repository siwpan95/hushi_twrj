<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今天《纽约日报》的约翰·奥多内尔引A·史密斯的美国自由联盟（Feb·1936）演说，其中有一句说：<br /><br />
　　从这时起，决心使宪法成为美国的公民圣经，让人们尊重宪法，正如人们虔诚地维护《圣经》一样……<br /><br />
　　此与我两次引T·H·赫胥黎的话，可以互相发明。<br /><br />
