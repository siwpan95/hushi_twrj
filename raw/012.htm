<td class="t50">1950年1月14日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　在P.H·与李德公谈，我说：“在这大局势里，私人很少扭转局势的力量。我在一九三七年的十月一日，曾作全国广播，说“侵略国家的那些军国主义者们也同样愚蠢，他们强把你们拖入上次战争，这次肯定也不例外”。后来果然灵验。我现在的看法还是这样：我们不可以轻易想立功，不可以轻易想走这路子，走那路子，要收速效。希腊人说得好：“神要毁灭的人，神先叫他们发疯。”总有水到渠成、瓜熟蒂落之一日。<br /><br />
</td></tr>
