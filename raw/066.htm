<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　早起得毛子水的电报：<br /><br />
　　傅孟真于星期三晚十一点去世。<br /><br />
　　我真伤心！<br /><br />
　　上午发一电给大彩：<br /><br />
　　傅孟真的去世使中国失去了一位最具天才的爱国者，我自己则失去了最好的朋友、诤友与保护人……<br /><br />
