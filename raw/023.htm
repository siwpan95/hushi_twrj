<td class="t50">1950年3月18日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　张兹闿（丽门）先生从台湾来，给我带了一包日记来。今记其目如下：<br /><br />
　　一九二八年Mar.—Apr.<br /><br />
　　一九二八年May—Jun.<br /><br />
　　一九二八年Jul.<br /><br />
　　一九二八年Aug.—Dec.<br /><br />
　　一九二九年Jan.—Apr.<br /><br />
　　一九二九年May.—Aug.<br /><br />
　　一九三〇年Jan.—Mar.<br /><br />
　　一九三〇年Jul.&amp;Aug.<br /><br />
　　（参看Mar.10—11记）<br /><br />
</td></tr>
