<tr><td>
<br />
　　“卑耳之马”<br /><br />
　　全谢山“赠赵东潜《水经注》序”末云：<br /><br />
　　东潜夺纛而登，囊括一切，犹以予为卑耳之马，不弃其鞅绊。岂知羽毛齿革，君之余也。其聊举先世之遗闻以益君，则庶几焉。<br /><br />
　　此中“卑耳之马”的故事，原出《管子·小问》篇第五十一。《水经注》引在卷十四《濡水》（滦河）篇，殿本页23—24。故事的中心在“霸王之君兴，则登山（《水经注》作“岂山”）之神见，且走马前，走导也”。谢山意谓东潜夺纛而登，霸业已成，谢山自称卑耳岂山之神，为霸王作马前走导而已。<br /><br />
