<td class="t50">1950年5月26日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　徐大春电告：冬秀决定搭泛美航空飞来，五月卅日动身，六月一日可到金山。大概直飞纽约？<br /><br />
　　写快信请张紫常、赵元任兄嫂、叶良才兄嫂，去接冬秀，使她没有入境困难。因明天到卅日，是“长假期”（卅日为“清明节”），我怕元任三家之中有全家出去玩的，故分写三封信，盼望有一家朋友在金山区域。<br /><br />
</td></tr>
