<td class="t50">1953年1月24日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　在西雅图。上午见杨□□君、李方桂夫妇、胡敦复先生夫妇。<br /><br />
　　华盛顿的中华俱乐部午餐。到的有五六十人，我有演说。与乔治·泰勒，F·麦可诸人，稍谈救济香港的流亡知识分子事。<br /><br />
　　下午到方桂家中，吃茶。<br /><br />
　　晚上华侨领袖在香港酒家晚餐，我有演说。<br /><br />
　　晚十点到飞机场，始知飞机改晚二小时。一点多才起飞。<br /><br />
