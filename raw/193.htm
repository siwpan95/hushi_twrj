<td class="t50">1952年11月4日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　今天到葛思德书库去翻查《清高宗诗》四集，及《永乐大典目录》等书，一天都在书桌上。<br /><br />
　　晚上在缪云台家看电视报告的选举结果。到十点钟，大体已决定，艾森豪威尔的大胜利已无问题了。<br /><br />
