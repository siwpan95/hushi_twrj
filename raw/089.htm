<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　宋以信夫妇约在他们的新房子里吃晚饭。遇见北大的日本学生川喜多长政，他是一九二一年到北大的。他现在是“东和映画株式会社”的社长（东京，西银座）。此人能说北京话、英语、德语，均很流利，人也很能干。<br /><br />
