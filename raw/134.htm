　　去年八月廿二日，我剪粘了杰克·莱特先生（《纽约镜报》）引的T·亨利·赫胥黎的话，今天我才查得这几句话出于他的《议论的问题》（1892），后来作为他的《科学和基督教传统》论集的《导言》（《导言》，P.57）。原文比莱特引的还更有力。<br /><br />
