<td class="t50">1950年11月17日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　在葛思德东方书库时，忽然学校派人带了一位日本学者泉井久之助来参观。他是京都大学教授兼京都大学图书馆馆长。我陪他约略看看葛思德东方书库藏书，后来才对他说我认识京都大学的一些人，他问我的名字，大惊讶，说，他少年时代就听说我的姓名了，不意在此相会。他说起他是吉川幸次郎的朋友，曾读吉川译的我的著作两种（其一为《四十自述》，其一为选录）。<br /><br />
　　学校的人来催他走，他不肯走，一定要和我长谈。我把住址给他，请他到纽约看我，他才走了。<br /><br />
</td></tr>
