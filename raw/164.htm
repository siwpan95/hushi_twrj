<td class="t50">1952年5月27日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　此信很有趣。我屡次说，倘使国民党肯把我送到监狱里去同陈独秀享受一样的待遇（除了他的“土摩登”朋友的探视一项），只消三年，我的几部书都可以写完了！<br /><br />
　　索罗金的书，我没有看见，但他说的花销很大的休假，大有我当日羡慕独秀的监狱生活的神情！<br /><br />
　　我当初作词，有“冰天十万囚徒”的话。我早已悔此数太不确了！<br /><br />
