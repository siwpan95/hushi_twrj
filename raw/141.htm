<td class="t50">1952年2月1日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　在普林斯顿，写《中国印书的一千年》，作“中国书展览”的小序。<br /><br />
　　昨天得陈通伯回信，他说莱昂内尔·贾尔斯博士很起劲，提议要照至少十三种敦煌卷子给我展览。<br /><br />
　　我回信去，要他加上卡特说的石刻《金刚经》敦煌本。我还要贾尔斯博士的小册子《敦煌六百年》。<br /><br />
</td></tr>
