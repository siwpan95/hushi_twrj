<td class="t50">1950年5月24日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　萧公权先生（萧公权，华盛顿，西雅图之西北，第19号大街，5201号）从华盛顿大学来信说：<br /><br />
　　我承华盛顿大学约来任教，并参加“远东学院”十九世纪中国史的研究工作。到此方知维特弗格被奉为“大师”。因此研究的方法和观点都大有问题。如长久留此，精神上恐难愉快。……<br /><br />
