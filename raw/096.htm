<td class="t50">1951年5月28日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　楼上朋友理查·布洛邀我去喝杯酒，有乔治·菲什博士。<br /><br />
　　布洛是美术家，他提倡意大利的花石雕磨，甚有成绩。<br /><br />
　　布洛与菲什要我看约瑟夫·米切尔的《老弗卢德先生》（达尔、斯隆和皮尔斯，纽约），我借了来，一气看完了三篇短篇小说，写的是纽约鱼市的人物，甚有诙谐风趣。<br /><br />
　　米切尔另有《麦克索利的漂亮酒吧》，当取来一读。<br /><br />
　　廷黻来谈。<br /><br />
