<td class="t50">1952年9月15日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　最后，我讲一个故事，是我去国三年半之中，最受感动的一条新闻：一九五〇年五月十六日美国各报发表土耳其（May 
14）大选举的结果。基马尔手创的共和国民党专政二十七年，这一次选举大失败了，仅得议会中487席的69席。而共和国民党昔年的经济部长、国务总理（1937—1939）巴也（Jelal 
Bayar）在一九四五创立的民主党，居然大胜利，得了408席，占议会的百分之八十四！<br /><br />
　　这是土耳其六百年中第一次尊从民意、和平的转移政权。<br /><br />
