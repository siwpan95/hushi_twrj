<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　但其中确有百分之二三是有意义的，其意义在于“不说破”。<br /><br />
　　其次是“行脚”，多参诸方善知识，多经历风霜雨雪之苦，多遇见四方才士学人，多磨炼出一点儿真知灼见。<br /><br />
　　禅学方法，如道一，如宣鉴，如义玄，都有自觉的了解。最有见解的是五祖山的法演（圆寂于1104），其后有径山的宗杲，都似有见于禅学的方法并且能说出一个道理来。宗杲的《宗门武库》最好。<br /><br />
　　朱子也有很透彻的说法。<br /><br />
