<td class="t50">1952年5月7日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　早八点，张君劢先生来吃早饭，谈了一点半。他是为了“第三势力”问题来的。我对他说，此时只有共产国际的势力与反共的势力，绝无第三势力的可能。香港的“第三势力”只能在国务院的小鬼手里讨一把“小米”吃吃罢了。这种发小米的“小鬼”，毫无力量，不能做什么事，也不能影响政策！<br /><br />
　　晚上八点在国家经济学和政治学学会讲从《开放门户到铁幕政策》。<br /><br />
