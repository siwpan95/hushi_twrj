<td class="t50">1950年2月24日</td></tr>
<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　昨日英国国会选举结果，工党仅仅占多数的议席。总数为六百廿五，过半数为三百一十三。今晚七点半的报告是工党仅得三百一十四席。<br /><br />
　　上页所记“一个意思”是有是，有不是的。我经过几年之后，才稍明白了。大概林颐山所得三个本子，除“王录本”外，陈本与书贾所来本皆董沛编书时所未见。林书札所称“夫子大人”是定海黄以周，其所谓“宗师”不是浙江学政，乃是江苏学政王先谦也。我说“三次”之第二次乃是王葵园在江阴想请林颐山编“全校”。<br /><br />
　　适之Sep.13，1959<br /><br />
