<tr><td class="jz">
<hr />
</td></tr>
<tr><td>
<br />
　　收到台湾省文献委员会印出的《台湾丛书》第三种，即先父铁花公的《台湾记录》两种：<br /><br />
　　1.《台湾日记》八卷<br /><br />
　　2.《台湾禀启存稿》三卷<br /><br />
　　附先人家传一卷<br /><br />
　　这是先父的最后一部分文稿，倒最先印行了，总算是完了我一部分的心愿。<br /><br />
